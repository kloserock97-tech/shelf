<!-- The loader covers a positioned box; the content underneath stays inert until every step is OK. -->
<div class="frame" style="position: relative; aspect-ratio: 4 / 3; max-width: 560px; overflow: hidden; border-radius: 12px;">
  <main id="app" tabindex="-1">
    <h1>Workspace ready</h1>
  </main>
  <div class="bsl"></div>
</div>

<link rel="stylesheet" href="boot-sequence.css">
<script type="module">
  import { createBootSequence } from './boot-sequence.js';

  const app = document.getElementById('app');
  const boot = createBootSequence(document.querySelector('.bsl'), {
    content: app,
    focus: app,
    header: ['NIGHTJAR BIOS 4.06', `CPU ${navigator.hardwareConcurrency || 1} threads`],
    steps: [
      { label: 'Loading fonts', run: () => document.fonts.ready },
      {
        label: 'Fetching data',
        run: async (progress) => {
          const res = await fetch('data.json');
          if (!res.ok) throw Object.assign(new Error(`server answered ${res.status}`), { code: 'E_HTTP_' + res.status });
          progress(1);
          return res.json();
        }
      },
      { label: 'Starting shell', run: () => new Promise((r) => requestAnimationFrame(r)) }
    ],
    onReady: (timings) => console.log(timings)
  });
  boot.start();
</script>
