<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Boot Sequence Loader</title>
<link rel="stylesheet" href="../variants/html/boot-sequence.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    display: grid; place-content: center; grid-template-columns: minmax(0, 600px);
    padding: 24px 16px; gap: 14px;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    --ink: #1c1d1f; --ink-2: #5d6066; --plastic: #e7e3da; --plastic-2: #d6d1c5; --line: #00000014;
    --app: #f7f6f2; --card: #ffffff; --accent: #2f7d4f;
    color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    body { --ink: #ecebe7; --ink-2: #9fa1a6; --plastic: #2b2c2f; --plastic-2: #1f2022; --line: #ffffff14;
      --app: #141516; --card: #1d1e20; --accent: #5fd28d; }
  }
  .monitor {
    padding: clamp(10px, 3.2vw, 18px);
    border-radius: 22px;
    background: linear-gradient(180deg, var(--plastic), var(--plastic-2));
    box-shadow: 0 1px 0 #ffffff59 inset, 0 18px 40px -18px #0000005c, 0 0 0 1px var(--line);
  }
  .glass {
    position: relative;
    aspect-ratio: 16 / 11;
    overflow: hidden;
    border-radius: 14px;
    background: #070a08;
    box-shadow: 0 0 0 1px #00000040, 0 2px 0 #ffffff40;
    isolation: isolate;
  }
  /* soft tube glare over everything, loader included */
  .glass::after {
    content: ""; position: absolute; inset: 0; z-index: 20; pointer-events: none; border-radius: inherit;
    background: radial-gradient(130% 100% at 30% 0%, #ffffff12, #ffffff00 45%);
    box-shadow: inset 0 0 40px #00000059;
  }
  .monitor__chin { display: flex; align-items: center; justify-content: space-between; padding: 10px 6px 0; color: var(--ink-2); font-size: 12px; }
  .led { width: 8px; height: 8px; border-radius: 50%; background: #9aa09a; box-shadow: 0 0 0 1px #00000026; }
  .is-on .led { background: #4fe08a; box-shadow: 0 0 8px #4fe08a; }
  .is-busy .led { background: #ffc65c; box-shadow: 0 0 8px #ffc65c; }

  /* the content the loader opens */
  .app {
    position: absolute; inset: 0; display: grid; grid-template-rows: 1fr auto; background: var(--app); outline: none;
  }
  .app canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; object-fit: cover; }
  .app__card {
    margin: -48px 14px 14px; padding: 14px 16px; border-radius: 14px; position: relative;
    background: var(--card); box-shadow: 0 10px 30px -12px #00000040, 0 0 0 1px var(--line);
  }
  .app__card h1 { margin: 0 0 2px; font-size: 18px; letter-spacing: -0.01em; }
  .app__card p { margin: 0; color: var(--ink-2); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  .controls { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 16px; }
  .controls button, .controls label {
    font: inherit; font-size: 13px; color: var(--ink); background: none; border: 0; padding: 6px 4px; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .controls button { font-weight: 600; padding: 7px 14px; border-radius: 999px; background: var(--card); box-shadow: 0 0 0 1px var(--line), 0 1px 2px #0000001a; }
  .controls input { accent-color: var(--accent); margin: 0; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .shot .controls { visibility: hidden; }
  .shot .bsl__cur { animation: none; }
  @media (max-width: 420px) { .glass { aspect-ratio: 4 / 3.4; } }
  @media (max-width: 420px) { .app__card { margin: -40px 10px 10px; padding: 12px; } .app__card h1 { font-size: 16px; } }
</style>
</head>
<body>
<div class="monitor" id="monitor">
  <div class="glass">
    <main class="app" id="app" tabindex="-1" aria-label="Workspace">
      <canvas width="240" height="135" aria-hidden="true"></canvas>
      <div class="app__card">
        <h1>Good evening</h1>
        <p id="summary">Workspace ready.</p>
      </div>
    </main>
    <div class="bsl" id="boot"></div>
  </div>
  <div class="monitor__chin"><span>NJ-14 Color</span><span class="led" aria-hidden="true"></span></div>
</div>
<div class="controls">
  <button type="button" id="reboot">Reboot</button>
  <label><input type="checkbox" id="fail"> Fail the data step</label>
</div>

<script type="module">
  import { createBootSequence } from '../variants/html/boot-sequence.js';

  const q = new URLSearchParams(location.search);
  const shot = q.get('shot');
  if (shot) document.documentElement.classList.add('shot');
  const monitor = document.getElementById('monitor');
  const app = document.getElementById('app');
  const canvas = app.querySelector('canvas');
  const failBox = document.getElementById('fail');
  const summary = document.getElementById('summary');
  const frame = () => new Promise((r) => requestAnimationFrame(r));
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));
  let failsLeft = 0;

  // Hash Kit mixer (items/hash-kit) for the scene's noise and dither
  function hashU(x) {
    x ^= x >>> 16; x = Math.imul(x, 0x3f9c86cb);
    x ^= x >>> 14; x = Math.imul(x, 0x1ae9dacf);
    x ^= x >>> 15;
    return x >>> 0;
  }
  const SALT = 0xb31c96c9;
  const h2 = (x, y) => hashU((x + hashU((y + SALT) >>> 0)) >>> 0) / 4294967296;
  function vnoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
    const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
    const a = h2(ix, iy), b = h2(ix + 1, iy), c = h2(ix, iy + 1), d = h2(ix + 1, iy + 1);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }

  // ---- real steps ----
  async function measureRefresh(progress) {
    const n = 12, t = [];
    for (let i = 0; i < n; i++) { t.push(await frame()); progress((i + 1) / n); }
    const dt = (t[n - 1] - t[0]) / (n - 1);
    return Math.round(1000 / dt);
  }
  async function fetchData(progress) {
    if (failsLeft > 0) {
      failsLeft--;
      for (let i = 1; i <= 8; i++) { progress(i * 0.05); await wait(70); }
      throw Object.assign(new Error('no answer from the data server in 8.0 s'), { code: 'E_NET_TIMEOUT' });
    }
    try {
      const res = await fetch(location.href, { cache: 'no-store' });
      const total = +res.headers.get('content-length') || 12000;
      const reader = res.body.getReader();
      let got = 0;
      for (;;) {
        const { done, value } = await reader.read();
        if (done) break;
        got += value.length;
        progress(Math.min(0.99, got / total));
      }
      return got;
    } catch {
      // file:// has no fetch: count a short wait instead
      for (let i = 1; i <= 10; i++) { progress(i / 10); await wait(40); }
      return 0;
    }
  }
  async function buildScene(progress) {
    const W = canvas.width, H = canvas.height, g = canvas.getContext('2d');
    const img = g.createImageData(W, H), px = img.data;
    const dark = matchMedia('(prefers-color-scheme: dark)').matches;
    const sky = dark ? [[18, 22, 48], [96, 52, 92], [236, 128, 90]] : [[120, 170, 222], [250, 196, 150], [255, 228, 170]];
    const hills = dark ? [[38, 44, 70], [26, 30, 50], [14, 16, 28]] : [[118, 150, 130], [78, 112, 96], [44, 70, 62]];
    const rowsPerChunk = 9;
    for (let y0 = 0; y0 < H; y0 += rowsPerChunk) {
      for (let y = y0; y < Math.min(H, y0 + rowsPerChunk); y++) {
        for (let x = 0; x < W; x++) {
          const v = y / H;
          const k = Math.min(1, v * 1.6);
          let c = k < 0.5 ? mix(sky[0], sky[1], k * 2) : mix(sky[1], sky[2], (k - 0.5) * 2);
          const sx = x - W * 0.66, sy = y - H * 0.4, sun = Math.hypot(sx, sy * 1.1);
          if (sun < 15) c = dark ? [255, 214, 160] : [255, 246, 214];
          for (let l = 0; l < 3; l++) {
            const ridge = H * (0.52 + l * 0.13) - vnoise(x / (40 - l * 9) + l * 7.3, l * 3.1) * H * (0.2 - l * 0.04)
              - vnoise(x / 9 + l * 11, l) * 4;
            if (y > ridge) c = hills[l];
          }
          const d = ((x * 0.3455768 + y * 0.4279792) % 1) - 0.5;
          const i = (y * W + x) * 4;
          px[i] = c[0] + d * 10; px[i + 1] = c[1] + d * 10; px[i + 2] = c[2] + d * 10; px[i + 3] = 255;
        }
      }
      progress(Math.min(1, (y0 + rowsPerChunk) / H));
      await frame();   // yield, so the page stays responsive while the scene builds
    }
    g.putImageData(img, 0, 0);
  }
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  let hz = 60;
  const realSteps = [
    { label: 'Measuring refresh rate', run: async (p) => { hz = await measureRefresh(p); } },
    { label: 'Loading fonts', run: () => document.fonts.ready },
    { label: 'Fetching data', run: fetchData },
    { label: 'Building scene', run: buildScene },
    { label: 'Starting shell', run: async (p) => { await frame(); p(0.5); await frame(); } }
  ];

  // posters: frozen moments
  const hang = () => new Promise(() => {});
  const shotSteps = {
    '1': realSteps.map((s, i) => ({ label: s.label, run: i < 3 ? (i === 2 ? () => wait(10) : s.run) : i === 3 ? async (p) => { await buildScene(() => {}); p(0.62); return hang(); } : hang })),
    fail: realSteps.map((s, i) => ({ label: s.label, run: i < 2 ? s.run : i === 2 ? async (p) => { p(0.4); throw Object.assign(new Error('no answer from the data server in 8.0 s'), { code: 'E_NET_TIMEOUT' }); } : hang })),
    fold: realSteps.map((s, i) => ({ label: s.label, run: i === 3 ? buildScene : () => Promise.resolve() }))
  };

  const mem = navigator.deviceMemory ? ` · RAM ${navigator.deviceMemory} GB` : '';
  const boot = createBootSequence(document.getElementById('boot'), {
    content: app,
    focus: app,
    header: [
      'NIGHTJAR BIOS 4.06  (c) 2026',
      `CPU ${navigator.hardwareConcurrency || 1} threads${mem}`,
      `Display ${screen.width}x${screen.height} @${+devicePixelRatio.toFixed(2)}x${matchMedia('(color-gamut: p3)').matches ? ' · P3' : ''}`
    ],
    steps: shot ? shotSteps[shot] ?? shotSteps['1'] : realSteps,
    cps: shot ? 1e6 : 110,
    holdMs: shot === 'fold' ? 0 : 420,
    onReady(timings) {
      monitor.classList.remove('is-busy'); monitor.classList.add('is-on');
      const total = timings.reduce((s, t) => s + t.ms, 0);
      summary.textContent = `Workspace ready in ${(total / 1000).toFixed(1)} s · ${hz} Hz display`;
    }
  });

  function start() {
    failsLeft = failBox.checked ? 1 : 0;
    monitor.classList.remove('is-on'); monitor.classList.add('is-busy');
    boot.start();
  }
  document.getElementById('reboot').addEventListener('click', start);
  start();

  if (shot === 'fold') {
    const t0 = performance.now();
    const poll = () => {
      if (document.querySelector('.bsl.is-folding')) boot.pauseFold(0.38);
      else if (performance.now() - t0 < 5000) requestAnimationFrame(poll);
    };
    requestAnimationFrame(poll);
  }
</script>
</body>
</html>
