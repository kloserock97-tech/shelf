<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Hash Kit</title>
<style>
  :root { --ink: #1d1d1f; --muted: #6e6e73; --line: rgba(0, 0, 0, 0.1); --panel: rgba(255, 255, 255, 0.72); --accent: #0071e3; }
  @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f7; --muted: #a1a1a6; --line: rgba(255, 255, 255, 0.14); --panel: rgba(28, 28, 30, 0.72); --accent: #2997ff; } }
  html, body { margin: 0; min-height: 100%; background: transparent; color: var(--ink); font: 13px/18px system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; box-sizing: border-box; min-height: 100vh; padding: 20px; max-width: min(720px, 88vh); margin: 0 auto; align-content: center; }
  figure { margin: 0; padding: 10px; border-radius: 14px; background: var(--panel); box-shadow: 0 0 0 1px var(--line); }
  canvas { display: block; width: 100%; aspect-ratio: 1; border-radius: 8px; image-rendering: pixelated; }
  figcaption { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; }
  figcaption b { font-weight: 600; }
  figcaption span { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  button { font: inherit; font-weight: 500; padding: 6px 14px; border: 0; border-radius: 999px; background: var(--accent); color: #fff; cursor: pointer; }
  button:active { transform: scale(0.97); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (max-width: 420px) { main { grid-template-columns: 1fr; padding: 16px; } }
</style>
</head>
<body>
<main>
  <div class="bar"><button id="seed" type="button">New seed</button><span id="seed-value" aria-live="polite"></span></div>
  <figure><canvas id="c-hash" width="128" height="128" role="img" aria-label="White noise from the grid hash"></canvas><figcaption><b>Hash</b><span>hash2(x, y)</span></figcaption></figure>
  <figure><canvas id="c-noise" width="192" height="192" role="img" aria-label="Value noise built on the hash, three octaves"></canvas><figcaption><b>Value noise</b><span>3 octaves</span></figcaption></figure>
  <figure><canvas id="c-dither" width="192" height="192" role="img" aria-label="A dark sky gradient in 5 bits: banded on the left, dithered on the right"></canvas><figcaption><b>Dither</b><span>raw · dithered</span></figcaption></figure>
  <figure><canvas id="c-avalanche" width="32" height="32" role="img" aria-label="Avalanche test: how often each output bit flips when one input bit flips"></canvas><figcaption><b>Avalanche</b><span id="bias">…</span></figcaption></figure>
</main>
<script type="module" src="demo.js"></script>
</body>
</html>
