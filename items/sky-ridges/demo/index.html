<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Sky Ridges</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="hud.css">
<style>
  html, body { height: 100%; margin: 0; background: #d9d3c2; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fallback[hidden] { display: none; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; font: 500 14px/20px Onest, system-ui, sans-serif; color: #1d1d1f; }
</style>
</head>
<body>
<canvas id="stage" aria-label="An evening sky over three forested ridges fading into haze."></canvas>
<p id="fallback" hidden>This demo needs WebGL2.</p>
<aside class="hud" aria-label="Controls">
  <button class="hud__head" type="button" aria-expanded="true">Sky and ridges
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="hud__body">
    <label class="hud__row"><span>Dusk</span><input type="range" name="dusk" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label class="hud__row"><span>Overcast</span><input type="range" name="overcast" min="0" max="1" step="0.01" value="0"><output></output></label>
    <label class="hud__row"><span>Haze</span><input type="range" name="haze" min="0.3" max="2.5" step="0.05" value="1"><output></output></label>
    <p class="hud__hint">Move the pointer: the near ridge shifts more than the far ones.</p>
  </div>
</aside>
<script src="hud.js"></script>
<script src="../variants/js/sky-ridges.js"></script>
<script src="scene.js"></script>
</body>
</html>
