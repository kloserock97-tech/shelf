<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Case Card Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400..600&family=Oswald:wght@600&display=swap">
<link rel="stylesheet" href="../variants/ts/card-stack.css">
<style>
  html, body { margin: 0; }
  /* a blurred evening field instead of the live 3D meadow behind the chapter */
  body {
    background:
      radial-gradient(70% 55% at 78% 8%, rgba(236, 196, 128, 0.34), transparent 70%),
      radial-gradient(120% 70% at 60% 112%, #6b7a39 0%, transparent 62%),
      radial-gradient(90% 70% at 8% 100%, #44522a 0%, transparent 66%),
      linear-gradient(180deg, #3a4430 0%, #222a19 48%, #1e2615 100%) fixed;
    background-color: #1e2615;
    -webkit-font-smoothing: antialiased;
  }
  .spacer { width: 1px; }
  .toast {
    position: fixed; left: 50%; top: 18px; z-index: 10; translate: -50% -8px; margin: 0; padding: 10px 16px; border-radius: 999px;
    background: rgba(255, 255, 255, 0.92); color: #1d1d1f; font: 500 14px/1 "Onest", system-ui, sans-serif;
    opacity: 0; pointer-events: none; transition: opacity 0.24s ease, translate 0.24s ease;
  }
  .toast.is-on { opacity: 1; translate: -50% 0; }
</style>
</head>
<body>
<section class="cases" aria-label="Case studies"></section>
<p class="toast" role="status"></p>
<div class="spacer"></div>
<script type="module" src="app.js"></script>
</body>
</html>
