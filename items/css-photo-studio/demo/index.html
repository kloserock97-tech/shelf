<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>CSS Photo Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500&display=swap">
<link rel="stylesheet" href="../variants/html/studio.css">
<style>
  html, body { height: 100%; margin: 0; background: transparent; }
  body { font-family: Onest, system-ui, sans-serif; }
  .studio { position: fixed; inset: 0; }
  .studio[data-grain="off"]::before { display: none; }

  /* A grey ball, the lighting reference of any shoot. It stands where the floor meets the sweep. */
  .studio { --ball-hi: #f1f2f3; --ball-mid: #a7a9ad; --ball-lo: #56585c; --floor-at: 68%; --shadow: rgb(22 23 26 / .5); }
  .studio--light { --ball-hi: #ffffff; --ball-mid: #d3d6da; --ball-lo: #969aa1; --floor-at: 73%; --shadow: rgb(44 48 56 / .34); }
  .studio--dark { --ball-hi: #9a9da3; --ball-mid: #4a4d53; --ball-lo: #1c1d20; --floor-at: 68%; --shadow: rgb(0 0 0 / .62); }
  .prop { position: absolute; left: 50%; top: var(--floor-at); width: clamp(120px, 30vmin, 300px); aspect-ratio: 1; translate: -50% -100%; }
  .prop__shadow { position: absolute; left: 50%; bottom: 0; width: 118%; height: 22%; translate: -48% 50%; border-radius: 50%; background: radial-gradient(closest-side, var(--shadow), rgb(0 0 0 / 0)); }
  .prop__ball {
    position: absolute; inset: 0; border-radius: 50%;
    background: radial-gradient(circle at 34% 28%, var(--ball-hi) 0%, var(--ball-mid) 42%, var(--ball-lo) 86%, var(--ball-lo) 100%);
    box-shadow: inset 0 -12px 24px -14px rgb(255 255 255 / .28);
  }

  .hud {
    position: absolute; top: 16px; left: 16px; display: flex; gap: 6px; align-items: center; padding: 4px;
    border-radius: 999px; background: rgb(255 255 255 / .58); color: #17181a;
    box-shadow: 0 6px 18px rgb(20 22 26 / .12), inset 0 0 0 .5px rgb(0 0 0 / .08);
    -webkit-backdrop-filter: blur(14px) saturate(1.4); backdrop-filter: blur(14px) saturate(1.4);
    font: 500 13px/1 Onest, system-ui, sans-serif;
  }
  .studio--dark .hud { background: rgb(40 42 46 / .6); color: #eceef0; box-shadow: 0 6px 18px rgb(0 0 0 / .3), inset 0 0 0 .5px rgb(255 255 255 / .12); }
  .seg { display: flex; gap: 2px; }
  .hud button {
    appearance: none; border: 0; margin: 0; padding: 8px 12px; border-radius: 999px; background: transparent; color: inherit;
    font: inherit; cursor: pointer; transition: background-color .16s ease;
  }
  .hud button:hover { background: rgb(0 0 0 / .06); }
  .studio--dark .hud button:hover { background: rgb(255 255 255 / .08); }
  .seg button[aria-pressed="true"] { background: #17181a; color: #fff; }
  .studio--dark .seg button[aria-pressed="true"] { background: #eceef0; color: #17181a; }
  .hud i { width: 1px; height: 18px; background: currentColor; opacity: .16; }
  .grain-btn { display: inline-flex; align-items: center; gap: 7px; }
  .grain-btn::before { content: ""; width: 8px; height: 8px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px currentColor; }
  .grain-btn[aria-pressed="true"]::before { background: currentColor; }
  .hud button:focus-visible { outline: 2px solid #0073e6; outline-offset: 1px; }
</style>
</head>
<body>
<main class="studio" aria-label="An empty photo studio with a grey ball">
  <div class="prop" aria-hidden="true"><i class="prop__shadow"></i><i class="prop__ball"></i></div>
  <div class="hud" role="toolbar" aria-label="Studio">
    <div class="seg" role="group" aria-label="Preset">
      <button type="button" data-preset="light" aria-pressed="false">Light</button>
      <button type="button" data-preset="grey" aria-pressed="false">Grey</button>
      <button type="button" data-preset="dark" aria-pressed="false">Dark</button>
    </div>
    <i aria-hidden="true"></i>
    <button type="button" class="grain-btn" data-grain aria-pressed="true">Grain</button>
  </div>
</main>
<script>
  // Preset follows the colour scheme until one is picked; ?preset=light|grey|dark and ?grain=0 for stills.
  const studio = document.querySelector('.studio');
  const params = new URLSearchParams(location.search);
  const scheme = matchMedia('(prefers-color-scheme: dark)');
  const PRESETS = ['light', 'grey', 'dark'];
  let picked = PRESETS.includes(params.get('preset')) ? params.get('preset') : null;

  const apply = (preset) => {
    studio.classList.remove('studio--light', 'studio--dark');
    if (preset !== 'grey') studio.classList.add(`studio--${preset}`);
    document.querySelectorAll('[data-preset]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.preset === preset)));
  };
  apply(picked ?? (scheme.matches ? 'dark' : 'light'));
  scheme.addEventListener('change', () => { if (!picked) apply(scheme.matches ? 'dark' : 'light'); });
  document.querySelectorAll('[data-preset]').forEach((b) => b.addEventListener('click', () => { picked = b.dataset.preset; apply(picked); }));

  const grain = document.querySelector('[data-grain]');
  const setGrain = (on) => { studio.dataset.grain = on ? 'on' : 'off'; grain.setAttribute('aria-pressed', String(on)); };
  setGrain(params.get('grain') !== '0');
  grain.addEventListener('click', () => setGrain(studio.dataset.grain === 'off'));
</script>
</body>
</html>
