<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Lite Mode Detector</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="../variants/ts/lite.css">
<style>
  :root { --ink: light-dark(#1d1d1f, #f5f5f7); --dim: light-dark(#6e6e73, #a1a1a6); --card: light-dark(#ffffff, #1c1c1e); --line: light-dark(#0000001a, #ffffff1f); --chip: light-dark(#f0f0f3, #2c2c2e); }
  html, body { margin: 0; background: transparent; }
  body { min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; padding: 16px; color: var(--ink); font: 400 13px/1.4 Onest, system-ui, sans-serif; }
  .wrap { display: grid; grid-template-columns: 330px minmax(0, 1fr); gap: 18px; align-items: center; width: min(1080px, 100%); }
  @media (max-width: 820px) { .wrap { grid-template-columns: minmax(0, 1fr); } }
  .panel { padding: 16px 18px 16px; border-radius: 20px; background: var(--card); box-shadow: 0 10px 30px #0000001a, inset 0 0 0 .5px var(--line); }
  h1 { margin: 0 0 4px; font-size: 15px; font-weight: 600; }
  .verdict { margin: 0 0 12px; color: var(--dim); }
  .verdict b { color: var(--ink); font-weight: 500; }
  ol { list-style: none; margin: 0 0 12px; padding: 0; display: grid; gap: 8px; }
  li { display: grid; grid-template-columns: 10px 1fr; column-gap: 10px; }
  li::before { content: ""; grid-row: span 2; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: #34a853; }
  li.no::before { background: #e8710a; }
  li span { color: var(--dim); font-size: 12px; }
  li b { font-weight: 500; overflow-wrap: anywhere; }
  .status { margin: 0 0 14px; padding: 8px 10px; border-radius: 10px; background: var(--chip); }
  .label { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
  .sims, .links { display: flex; flex-wrap: wrap; gap: 6px; }
  .links { margin-top: 12px; align-items: center; }
  button, .links a {
    appearance: none; border: 0; margin: 0; padding: 7px 11px; border-radius: 999px; cursor: pointer;
    background: var(--chip); color: var(--ink); font: 500 12px/1.1 Onest, system-ui, sans-serif; text-decoration: none;
  }
  button:hover:not(:disabled), .links a:hover { background: light-dark(#e4e4e9, #3a3a3c); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, a:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }

  /* the mock page: live 3D in the hero, or a static poster in the lite version */
  .page { position: relative; overflow: hidden; aspect-ratio: 16 / 10; max-height: calc(100vh - 32px); border-radius: 18px; background: #fbfaf7; color: #1d1d1f; box-shadow: 0 10px 30px #0000001f, inset 0 0 0 .5px #0000001a; }
  .page__bar { display: flex; align-items: center; gap: 8px; height: 11%; padding: 0 4%; }
  .page__bar i { width: 18px; height: 18px; border-radius: 50%; background: #1d1d1f; margin-right: auto; }
  .page__bar span { width: 44px; height: 8px; border-radius: 4px; background: #d9d6cf; }
  .page__hero { position: relative; height: 58%; margin: 0 4%; border-radius: 12px; overflow: hidden; background: #cfd6e6; }
  .page__hero canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .page__tag { position: absolute; top: 10px; left: 10px; padding: 4px 9px; border-radius: 999px; background: #ffffffc7; font-size: 11px; font-weight: 500; }
  .page__tag::before { content: "Live 3D"; }
  .page__row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3%; height: 17%; margin: 3% 4% 0; }
  .page__row i { border-radius: 10px; background: #ece9e2; }
  .is-lite .page__hero canvas { display: none; }
  .is-lite .page__hero { background:
    radial-gradient(130% 62% at 28% 100%, #40694a 0 50%, #0000 50.4%),
    radial-gradient(150% 76% at 86% 100%, #739a69 0 50%, #0000 50.4%),
    radial-gradient(circle at 70% 44%, #ffe6b8 0 7%, #0000 7.6%),
    linear-gradient(to top, #f7c697 10%, #8195c8); }
  .is-lite .page__tag::before { content: "Static poster"; }
  .page .lite-bar { position: absolute; bottom: 10px; max-width: calc(100% - 20px); font-family: Onest, system-ui, sans-serif; }
  @media (max-width: 820px) { .page { aspect-ratio: 4 / 3; } .page__hero { height: 52%; } }
</style>
</head>
<body>
<div class="wrap">
  <section class="panel" aria-label="Lite mode check">
    <h1>Lite mode detector</h1>
    <p class="verdict">At load: <b data-verdict></b></p>
    <ol data-checks></ol>
    <p class="status" data-status aria-live="polite"></p>
    <p class="label">Break it on purpose</p>
    <div class="sims">
      <button type="button" data-sim="webgl">No WebGL2</button>
      <button type="button" data-sim="software">Software GPU</button>
      <button type="button" data-sim="slow">Too slow</button>
      <button type="button" data-sim="context">Lose context</button>
      <button type="button" data-sim="stall">Stalled</button>
    </div>
    <div class="links">
      <a href="?lite=1">?lite=1</a><a href="?lite=0">?lite=0</a><button type="button" data-reload>Reload</button>
    </div>
  </section>
  <div class="page" aria-label="A page that shows 3D or its lite version">
    <header class="page__bar" aria-hidden="true"><i></i><span></span><span></span><span></span></header>
    <div class="page__hero"><canvas aria-label="A small live 3D scene: hills at sunset"></canvas><span class="page__tag" aria-hidden="true"></span></div>
    <div class="page__row" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
