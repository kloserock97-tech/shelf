<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Audio Graph</title>
<link rel="stylesheet" href="../variants/html/audio-graph.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 12px; box-sizing: border-box;
    font: clamp(13px, 0.7vw + 7px, 16px)/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  main { width: min(56em, 100%); display: grid; gap: 0.8em; }
  .hint { margin: 0; text-align: center; color: #636366; font-size: 0.85em; }
  @media (prefers-color-scheme: dark) { .hint { color: #aaaaaf; } }
</style>
</head>
<body>
<main>
  <figure class="ag" id="ag" aria-labelledby="ag-title" data-playing="false">
    <header class="ag__head">
      <div>
        <h1 class="ag__title" id="ag-title">Heart rate, Sunday 10K</h1>
        <p class="ag__sub">Sep 27, 07:42 · 10.0 km in 52:18</p>
      </div>
      <button class="ag__mute" type="button" aria-pressed="true" aria-label="Sound" title="Sound (M)">
        <svg class="ic-on" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.6h2.6L10 4.4v11.2l-3.9-3.2H3.5z"/><path d="M13 7.4a3.6 3.6 0 0 1 0 5.2M15.2 5.2a6.8 6.8 0 0 1 0 9.6"/></svg>
        <svg class="ic-off" viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 7.6h2.6L10 4.4v11.2l-3.9-3.2H3.5z"/><path d="m13.2 8 4 4M17.2 8l-4 4"/></svg>
      </button>
    </header>
    <p class="ag__read" aria-hidden="true"><span class="ag__value"></span><span class="ag__where"></span><span class="ag__pitch"></span></p>
    <div class="ag__plot" tabindex="0" role="slider" aria-label="Heart rate by kilometre. Arrow keys play each point, Space plays the whole run."></div>
    <div class="ag__controls">
      <button class="ag__play" type="button" aria-pressed="false">
        <svg class="ic-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M4.5 2.8v10.4a.6.6 0 0 0 .9.5l8.2-5.2a.6.6 0 0 0 0-1L5.4 2.3a.6.6 0 0 0-.9.5z"/></svg>
        <svg class="ic-pause" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.8" y="2.8" width="3" height="10.4" rx="0.8"/><rect x="9.2" y="2.8" width="3" height="10.4" rx="0.8"/></svg>
        <span class="ag__play-label">Play</span>
      </button>
      <button class="ag__btn ag__speak" type="button">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.8 3.2h10.4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H8l-3 2.6v-2.6H2.8a1 1 0 0 1-1-1v-6a1 1 0 0 1 1-1z"/></svg>
        Speak summary
      </button>
      <div class="ag__seg" role="radiogroup" aria-label="Chart type">
        <button type="button" role="radio" aria-checked="true" data-mode="line">Line</button>
        <button type="button" role="radio" aria-checked="false" data-mode="bars">Bars</button>
      </div>
    </div>
    <p class="ag__summary" id="ag-summary"></p>
  </figure>
  <p class="hint">Higher heart rate, higher pitch. Press Play, or run a finger, the mouse or ← → along the chart. M mutes.</p>
</main>

<script type="module">
  import { audioGraph, describe } from '../variants/html/audio-graph.js';

  // A 10 km run sampled every 100 m: warm-up, a hill at 3.3 km, a bridge at 7.9 km, a final kick.
  // The watch lost the signal in a tunnel from 6.1 to 6.6 km. Noise from Hash Kit's mixer.
  function hashU(x) {
    x ^= x >>> 16; x = Math.imul(x, 0x3f9c86cb);
    x ^= x >>> 14; x = Math.imul(x, 0x1ae9dacf);
    x ^= x >>> 15;
    return x >>> 0;
  }
  const unit = (i) => hashU((i + 0xb31c96c9) >>> 0) / 4294967296;
  const points = [];
  for (let i = 0; i <= 100; i++) {
    const km = i / 10;
    let hr = 118 + 34 * (1 - Math.exp(-km / 0.6));
    hr += 9 * Math.exp(-((km - 3.3) ** 2) / 0.18);
    hr += 11 * Math.exp(-((km - 7.9) ** 2) / 0.22);
    hr += km > 9.1 ? (km - 9.1) * 22 : 0;
    hr += 0.6 * km + (unit(900 + i) - 0.5) * 4;
    points.push({ x: km, v: i >= 61 && i <= 66 ? null : Math.round(hr) });
  }
  const have = points.filter((p) => p.v !== null);
  const avg = Math.round(have.reduce((s, p) => s + p.v, 0) / have.length);
  const fmtX = (v) => (Number.isInteger(v) ? String(v) : v.toFixed(1));

  const root = document.querySelector('#ag');
  const summary = describe(points, { name: 'Heart rate over a 10 kilometre run', unit: 'bpm', spokenUnit: 'beats per minute', xUnit: 'kilometre', fmtX });
  root.querySelector('#ag-summary').textContent = summary;
  root.querySelector('.ag__plot').setAttribute('aria-describedby', 'ag-summary');

  const graph = audioGraph(root, {
    points,
    labelX: 'km', labelY: 'bpm', spokenY: 'beats per minute',
    format: { x: (v) => v.toFixed(1) },
    restWhere: 'average over 10 km', restValue: `${avg} bpm`,
    gapLabel: 'No signal',
    barEvery: 5,
    durationMs: 6000
  });

  root.querySelectorAll('.ag__seg button').forEach((b) => b.addEventListener('click', () => {
    root.querySelectorAll('.ag__seg button').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
    graph.setMode(b.dataset.mode);
  }));

  // ?shot=1 — the sweep frozen at 7.2 km, for the poster
  if (new URLSearchParams(location.search).get('shot') === '1') {
    requestAnimationFrame(() => {
      graph.freeze(72);
      root.querySelector('.ag__play-label').textContent = 'Pause';
    });
  }
</script>
</body>
</html>
