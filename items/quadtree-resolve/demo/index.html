<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Quadtree Resolve</title>
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body { font: 13px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d1c1a; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: pan-y; }
  .loader {
    position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); box-sizing: border-box;
    width: min(400px, calc(100vw - 32px)); display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px;
    padding: 8px 8px 8px 14px; border-radius: 999px;
    background: #fbf9f5e6; box-shadow: 0 8px 26px #1e1a1426, 0 0 0 1px #1e1a1414; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .loader__label { font-variant-numeric: tabular-nums; font-weight: 600; min-width: 92px; }
  .loader input { width: 100%; margin: 0; accent-color: #b8673f; }
  .loader button {
    font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 999px; cursor: pointer;
    border: 1px solid #1e1a1424; background: #fff; color: inherit;
  }
  .loader button:hover { background: #f3eee6; }
  .loader :focus-visible { outline: 2px solid #4a6e96; outline-offset: 2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-color-scheme: dark) {
    body { color: #ece7de; }
    .loader { background: #1c1d21e0; box-shadow: 0 8px 26px #00000073, 0 0 0 1px #ffffff14; }
    .loader input { accent-color: #d79a76; }
    .loader button { background: #2a2b30; border-color: #ffffff1f; }
    .loader button:hover { background: #33343a; }
    .loader :focus-visible { outline-color: #9dbbe0; }
  }
</style>
</head>
<body>
<canvas id="stage" role="img" aria-label="A dusk landscape resolving from coarse squares into detail. Move the pointer to sharpen the area under it."></canvas>
<div class="loader">
  <span class="loader__label" aria-hidden="true">Loading 0%</span>
  <input type="range" min="0" max="100" step="1" value="0" aria-label="Load progress">
  <button type="button">Replay</button>
</div>
<p class="sr" role="status"></p>
<script type="module">
  import { createQuadtreeResolve, paintDusk } from "../variants/html/quadtree-resolve.js";

  const query = new URLSearchParams(location.search);
  const shot = query.has("shot");
  const canvas = document.querySelector("#stage");
  const qt = createQuadtreeResolve(canvas, { paint: paintDusk, pointerTarget: document.body });
  const label = document.querySelector(".loader__label");
  const range = document.querySelector(".loader input");
  const status = document.querySelector("[role=status]");
  const show = (p) => {
    const pct = Math.round(p * 100);
    label.textContent = pct >= 100 ? "Loaded" : `Loading ${pct}%`;
    range.value = pct;
    range.setAttribute("aria-valuetext", `${pct}%`);
  };

  /* A stand-in network: about six seconds with uneven bursts and a stall around a third. */
  let raf = 0, p = 0, last = 0, t = 0;
  function load(now) {
    const dt = Math.min(0.05, (now - (last || now)) / 1000); last = now; t += dt;
    const rate = t > 1.7 && t < 2.4 ? 0.01 : 0.12 + 0.18 * (0.5 + 0.5 * Math.sin(t * 2.3)) * (0.5 + 0.5 * Math.sin(t * 0.9 + 1));
    p = Math.min(1, p + rate * dt);
    qt.setProgress(p); show(p);
    if (p < 1) raf = requestAnimationFrame(load);
    else { raf = 0; status.textContent = "Image loaded"; }
  }
  function replay() {
    cancelAnimationFrame(raf);
    p = 0; t = 0; last = 0; status.textContent = "";
    raf = requestAnimationFrame(load);
  }
  range.addEventListener("input", () => {
    cancelAnimationFrame(raf); raf = 0;
    p = Number(range.value) / 100;
    qt.setProgress(p); show(p);
  });
  document.querySelector(".loader button").addEventListener("click", replay);

  if (shot) {
    p = Number(query.get("p") ?? 0.55);
    qt.setProgress(p); show(p);
    const r = canvas.getBoundingClientRect();
    qt.setLens(r.width * 0.3, r.height * 0.62, 1);
  } else replay();
</script>
</body>
</html>
