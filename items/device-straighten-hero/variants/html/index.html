<!-- Device-straighten hero. Swap .hero-art--browser for .hero-art--phone (and drop .hero-bar) for a phone.
     --oar is the object's width / height. The page needs room to scroll below the hero. -->
<header class="hero">
  <div class="hero-stage">
    <div class="hero-text">
      <p class="hero-kicker">B2B dashboard · Web · 2026</p>
      <h1>Review queue</h1>
      <p class="hero-tagline">One list for everything a moderator checks: what's waiting, what's flagged and why.</p>
    </div>
    <figure class="hero-art hero-art--browser" style="--oar:1.1643">
      <div class="hero-device">
        <div class="hero-bar" aria-hidden="true"><i></i><i></i><i></i></div>
        <img class="hero-screen" src="queue.svg" width="1280" height="800" alt="Review queue dashboard" decoding="async" fetchpriority="high" draggable="false">
      </div>
      <picture class="hero-obj" aria-hidden="true">
        <source type="image/avif" srcset="lens.avif">
        <img src="lens.webp" alt="" width="900" height="773" decoding="async" draggable="false">
      </picture>
    </figure>
  </div>
  <dl class="hero-facts">
    <div><dt>Role</dt><dd>Product designer</dd></div>
    <div><dt>Team</dt><dd>Two designers, five engineers</dd></div>
    <div><dt>Timeline</dt><dd>2026, four months</dd></div>
    <div><dt>Platform</dt><dd>Web, desktop</dd></div>
  </dl>
</header>

<link rel="stylesheet" href="hero.css">
<script src="hero.js" defer></script>
