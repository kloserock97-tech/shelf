<!-- Radios hold the state: give the group one name, check one by default. Icons are optional. -->
<fieldset class="sqg">
  <legend class="sqg__legend">Calendar view</legend>
  <div class="sqg__track">
    <label class="sqg__btn">
      <input type="radio" name="view" value="day">
      <span class="sqg__in"><span class="sqg__text">Day</span></span>
    </label>
    <label class="sqg__btn">
      <input type="radio" name="view" value="week" checked>
      <span class="sqg__in"><span class="sqg__text">Week</span></span>
    </label>
    <label class="sqg__btn">
      <input type="radio" name="view" value="month">
      <span class="sqg__in"><span class="sqg__text">Month</span></span>
    </label>
  </div>
</fieldset>

<link rel="stylesheet" href="squish-group.css">
<script src="squish-group.js" defer></script>
