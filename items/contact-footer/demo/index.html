<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Contact Footer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300..600&family=Playfair+Display:ital,wght@1,400&display=swap">
<link rel="stylesheet" href="../variants/html/contact-footer.css">
<style>
  html, body { margin: 0; background: #2c2740; }
  body { font-family: "Onest", system-ui, sans-serif; font-weight: 300; }
  /* a frame of the portfolio's own hill scene at sunset */
  .site-footer { background-image: url("hill-dusk.webp"); }
</style>
</head>
<body>
<footer class="site-footer" id="contact">
  <div class="sf-top">
    <p class="sf-kicker">Open to new projects</p>
    <h2 class="sf-title"><span>Let's make something</span> <span>complex feel <em class="serif-accent">simple.</em></span></h2>
    <div class="sf-contacts">
      <a class="sf-pill sf-pill--go" href="mailto:hello@example.com">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.4 4.2h11.2v7.6H2.4z"/><path d="m2.6 4.5 5.4 4.2 5.4-4.2"/></svg>
        <span>Write an e-mail</span>
      </a>
      <a class="sf-pill" href="#">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M14 2 7 9"/><path d="M14 2 9.6 14l-2.6-5-5-2.6z"/></svg>
        <span>Telegram</span>
      </a>
      <a class="sf-pill" href="#">
        <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.4" y="3" width="11.2" height="10" rx="2"/><circle cx="6.2" cy="7.2" r="1.3"/><path d="M4.2 10.8c.4-1.1 1.1-1.6 2-1.6s1.6.5 2 1.6"/><path d="M10 6.8h1.8M10 9h1.8"/></svg>
        <span>LinkedIn</span>
      </a>
      <button class="sf-copy" type="button" data-copy="hello@example.com">
        <svg class="sf-ic sf-ic--copy" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.6" y="5.6" width="8" height="8" rx="1.6"/><path d="M10.6 5.6V4a1.6 1.6 0 0 0-1.6-1.6H4A1.6 1.6 0 0 0 2.4 4v5a1.6 1.6 0 0 0 1.6 1.6h1.6"/></svg>
        <svg class="sf-ic sf-ic--done" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8.6 3.2 3.2L13 5"/></svg>
        <span class="sf-copy-l">hello@example.com</span>
      </button>
    </div>
  </div>
  <div class="sf-bar">
    <p class="sf-copyright">© Your Name 2026</p>
    <nav class="sf-nav" aria-label="Footer">
      <a href="#work">Work</a>
      <a href="#about">About</a>
      <a href="#top">Back to top ↑</a>
      <a href="#credits">Credits</a>
    </nav>
  </div>
</footer>
<script src="../variants/html/contact-footer.js"></script>
</body>
</html>
