<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Edge AA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="hud.css">
<style>
  html, body { height: 100%; margin: 0; background: #d8c7a4; overflow: hidden; }
  /* the scene is rendered at DPR 1 on purpose; square pixels on sharper screens */
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; cursor: crosshair; touch-action: none; }
  #fallback[hidden] { display: none; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; font: 500 14px/20px Onest, system-ui, sans-serif; color: #1d1d1f; }
  .split { position: fixed; top: 0; bottom: 0; width: 44px; margin-left: -22px; cursor: ew-resize; touch-action: none; outline: none; z-index: 1; }
  .split::before { content: ""; position: absolute; left: 21.5px; top: 0; bottom: 0; width: 1px; background: rgba(255, 255, 255, 0.85); }
  .split::after { content: ""; position: absolute; left: 12px; top: 84%; width: 20px; height: 20px; margin-top: -10px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.4); }
  .split:focus-visible::after { box-shadow: 0 0 0 2px #1d1d1f, 0 0 0 4px #2997ff; }
  .split span { position: absolute; top: 64px; font: 600 12px/16px Onest, system-ui, sans-serif; color: #fff; white-space: nowrap; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7); }
  .split span:first-child { right: 34px; }
  .split span:last-child { left: 34px; }
</style>
</head>
<body>
<canvas id="stage" aria-label="Wires, a turning wheel and thin grass drawn with hard pixel edges, raw on the left and smoothed on the right, with a loupe."></canvas>
<p id="fallback" hidden>This demo needs WebGL2.</p>
<div class="split" id="split" role="slider" tabindex="0" aria-label="Divider between the raw and the smoothed frame" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50"><span>Raw</span><span>Edge AA</span></div>
<aside class="hud" aria-label="Controls">
  <button class="hud__head" type="button" aria-expanded="true">Edge AA
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="hud__body">
    <div class="hud__row" style="grid-template-columns: 70px 1fr"><span>Strength</span>
      <div class="seg" role="group" aria-label="Strength" data-name="aa">
        <button type="button" value="off" aria-pressed="false">Off</button>
        <button type="button" value="half" aria-pressed="false">Half</button>
        <button type="button" value="full" aria-pressed="true">Full</button>
      </div>
    </div>
    <div class="hud__row" style="grid-template-columns: 70px 1fr"><span>View</span>
      <div class="seg" role="group" aria-label="View" data-name="view">
        <button type="button" value="split" aria-pressed="true">Split</button>
        <button type="button" value="full" aria-pressed="false">Full</button>
        <button type="button" value="edges" aria-pressed="false">Edges</button>
      </div>
    </div>
    <p class="hud__hint">The loupe follows the pointer and shows real pixels. Full: no MSAA. Half: with MSAA 2×. Edges: the pixels the pass touched.</p>
  </div>
</aside>
<script src="hud.js"></script>
<script src="../variants/js/edge-aa.js"></script>
<script src="scene.js"></script>
</body>
</html>
