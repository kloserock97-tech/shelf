<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>God Rays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="hud.css">
<style>
  html, body { height: 100%; margin: 0; background: #d9cdb4; overflow: hidden; }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #stage:active { cursor: grabbing; }
  #fallback[hidden] { display: none; }
  #fallback { position: fixed; inset: 0; display: grid; place-items: center; font: 500 14px/20px Onest, system-ui, sans-serif; color: #1d1d1f; }
</style>
</head>
<body>
<canvas id="stage" tabindex="0" aria-label="A low sun behind a tree on a hill. Drag or use the arrow keys to move the sun."></canvas>
<p id="fallback" hidden>This demo needs WebGL2.</p>
<aside class="hud" aria-label="Controls">
  <button class="hud__head" type="button" aria-expanded="true">God rays
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="hud__body">
    <div class="seg" role="group" aria-label="View" data-name="view">
      <button type="button" value="off" aria-pressed="false">Off</button>
      <button type="button" value="on" aria-pressed="true">On</button>
      <button type="button" value="mask" aria-pressed="false">Mask</button>
      <button type="button" value="rays" aria-pressed="false">Rays</button>
    </div>
    <label class="hud__row"><span>Strength</span><input type="range" name="strength" min="0" max="1.5" step="0.01" value="0.32"><output></output></label>
    <label class="hud__row"><span>Halo</span><input type="range" name="halo" min="1" max="20" step="0.5" value="5"><output></output></label>
    <label class="hud__row"><span>Threshold</span><input type="range" name="threshold" min="0.3" max="2" step="0.05" value="0.85"><output></output></label>
    <p class="hud__hint">Drag to move the sun. Push it past the edge: the fan still comes in, then fades.</p>
  </div>
</aside>
<script src="hud.js"></script>
<script src="../variants/js/god-rays.js"></script>
<script src="scene.js"></script>
</body>
</html>
