<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Unit Morph Chart</title>
<link rel="stylesheet" href="../variants/html/unit-morph.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 12px; box-sizing: border-box;
    font: clamp(13px, 0.7vw + 7px, 16px)/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  main { width: min(60em, 100%); }
</style>
</head>
<body>
<main>
  <figure class="um" id="um" aria-labelledby="um-title">
    <header class="um__head">
      <div>
        <p class="um__eyebrow">Support desk · September</p>
        <h1 class="um__title" id="um-title">300 tickets, one dot each</h1>
        <p class="um__note"></p>
      </div>
      <div class="um__views" aria-label="Layout"></div>
    </header>
    <div class="um__plot" tabindex="0" role="group" aria-roledescription="unit chart" aria-labelledby="um-title"
         aria-describedby="um-keys"></div>
    <footer class="um__foot">
      <ul class="um__legend" aria-label="Topics"></ul>
      <p class="um__hint" id="um-keys">Hover a dot, then switch layouts: it stays held. Click pins, ← → walk, 1–4 switch.</p>
    </footer>
    <div class="um__sr"></div>
    <p class="um__live" role="status"></p>
  </figure>
</main>

<script type="module">
  import { unitMorph, columns, waffle, swarm, tiles } from '../variants/html/unit-morph.js';

  // Seeded numbers: Hash Kit's mixer over a Weyl sequence.
  function hashU(x) {
    x ^= x >>> 16; x = Math.imul(x, 0x3f9c86cb);
    x ^= x >>> 14; x = Math.imul(x, 0x1ae9dacf);
    x ^= x >>> 15;
    return x >>> 0;
  }
  function makeRandom(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0xb31c96c9) >>> 0; return hashU(s) / 4294967296; };
  }
  const rnd = makeRandom(918);
  const gauss = () => { let u = 0; while (u === 0) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };
  const pick = (w) => { let t = rnd(), i = 0; while (i < w.length - 1 && (t -= w[i]) > 0) i++; return i; };

  const TOPICS = ['Billing', 'Account', 'Bugs', 'Delivery', 'Requests'];
  const REGIONS = ['North America', 'Europe', 'Asia-Pacific', 'Latin America', 'Africa & ME'];
  const MEDIAN_H = [2.6, 1.4, 17, 8, 30];   // typical hours to resolve, per topic
  const CHANNELS = ['Chat', 'Email', 'Phone'];

  const tickets = Array.from({ length: 300 }, (_, i) => {
    const topic = pick([0.27, 0.21, 0.24, 0.16, 0.12]);
    const hours = Math.min(110, Math.max(0.2, MEDIAN_H[topic] * Math.exp(0.85 * gauss())));
    const csat = Math.max(1, Math.min(5, Math.round(5.3 - 0.42 * Math.log(hours + 1) + 0.7 * gauss())));
    return { id: `T-${4120 + i}`, topic, region: pick([0.26, 0.31, 0.23, 0.12, 0.08]), hours, csat, channel: CHANNELS[pick([0.55, 0.33, 0.12])] };
  });

  const hrs = (h) => h < 1 ? `${Math.round(h * 60)} min` : h < 48 ? `${h < 10 ? h.toFixed(1) : Math.round(h)} h` : `${(h / 24).toFixed(1)} days`;
  const tick = (h) => h < 1 ? `${h * 60}m` : h < 24 ? `${h}h` : `${h / 24}d`;
  const sorted = tickets.map((t) => t.hours).sort((a, b) => a - b);
  const median = sorted[sorted.length >> 1];

  const icon = (body) => `<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">${body}</svg>`;
  const ICONS = {
    bars: icon('<rect x="2" y="7" width="3" height="7" rx="1"/><rect x="6.5" y="3" width="3" height="11" rx="1"/><rect x="11" y="9" width="3" height="5" rx="1"/>'),
    waffle: icon('<rect x="2" y="2" width="5" height="5" rx="1.2"/><rect x="9" y="2" width="5" height="5" rx="1.2"/><rect x="2" y="9" width="5" height="5" rx="1.2"/><rect x="9" y="9" width="5" height="5" rx="1.2" opacity=".45"/>'),
    swarm: icon('<circle cx="3" cy="8" r="1.7"/><circle cx="6.5" cy="5.5" r="1.7"/><circle cx="6.5" cy="10.5" r="1.7"/><circle cx="10" cy="8" r="1.7"/><circle cx="13.3" cy="8" r="1.7"/>'),
    map: icon('<rect x="1.5" y="3" width="4" height="4" rx="1"/><rect x="6.5" y="3" width="3" height="3" rx="1"/><rect x="10.5" y="5" width="4" height="5" rx="1"/><rect x="2.5" y="9" width="3" height="4" rx="1"/><rect x="7" y="8.5" width="2.5" height="3" rx="1"/>')
  };

  const byHours = (t) => t.hours;
  const chart = unitMorph(document.querySelector('#um'), {
    records: tickets,
    color: (t) => t.topic,
    legend: TOPICS,
    describe: (t) => `${t.id}, ${TOPICS[t.topic]}, ${REGIONS[t.region]}, resolved in ${hrs(t.hours)}, satisfaction ${t.csat} of 5`,
    tip: (t) => ({ title: t.id, rows: [['Topic', TOPICS[t.topic]], ['Region', REGIONS[t.region]], ['Channel', t.channel], ['Resolved in', hrs(t.hours)], ['Satisfaction', `${'★'.repeat(t.csat)}${'☆'.repeat(5 - t.csat)}`]] }),
    layouts: [
      { id: 'bars', label: 'Bars', icon: ICONS.bars, note: 'How many tickets each topic brought in.',
        build: columns({ group: (t) => t.topic, labels: TOPICS, sortBy: byHours }) },
      { id: 'waffle', label: 'Share', icon: ICONS.waffle, note: 'The same 300 as one block: each topic’s share of the month.',
        build: waffle({ group: (t) => t.topic, labels: TOPICS, sortBy: byHours }) },
      { id: 'swarm', label: 'Speed', icon: ICONS.swarm, note: 'Time to resolve, fastest on the left. Bugs and requests drag the tail.',
        build: swarm({ value: byHours, domain: [0.2, 110], log: true, ticks: [0.5, 1, 4, 12, 24, 48, 96], format: tick,
          title: 'Time to resolve, log scale', marker: { value: median, html: `Median <b>${hrs(median)}</b>` },
          bins: [{ label: 'Under 1 hour', from: 0, to: 1 }, { label: '1 to 4 hours', from: 1, to: 4 }, { label: '4 to 24 hours', from: 4, to: 24 }, { label: '1 to 4 days', from: 24, to: 96 }, { label: 'Over 4 days', from: 96, to: 1e9 }] }) },
      { id: 'map', label: 'Region', icon: ICONS.map, note: 'Where tickets came from, one block per region, same dot size everywhere.',
        build: tiles({ group: (t) => t.region, labels: REGIONS, at: [[0, 0], [1, 0], [2, 0.5], [0, 1], [1, 1]],
          narrow: { below: 520, cols: 2, rows: 3, at: [[0, 0], [1, 0], [1, 1], [0, 1], [0.5, 2]] }, sortBy: (t) => t.topic * 1000 + t.hours }) }
    ]
  });

  // ?shot=1 — the speed swarm with one slow bug held
  if (new URLSearchParams(location.search).get('shot') === '1') {
    chart.show(2, false);
    const slow = tickets.map((t, i) => [t, i]).filter(([t]) => t.topic === 2).sort((a, b) => b[0].hours - a[0].hours)[6][1];
    chart.hold(slow, true);
  }
</script>
</body>
</html>
