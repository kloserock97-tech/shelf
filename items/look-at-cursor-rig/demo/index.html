<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Look-at Cursor Rig</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@500&display=swap" rel="stylesheet">
<style>
  html, body { height: 100%; margin: 0; background: transparent; }
  body { overflow: hidden; font-family: Onest, "Segoe UI", Roboto, sans-serif; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hud {
    position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); translate: -50% 0;
    display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px; border-radius: 999px;
    font-size: 13px; line-height: 1.2; white-space: nowrap; color: #1d1d1f; cursor: pointer;
    background: rgba(255, 255, 255, 0.72); box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.12), 0 6px 18px rgba(30, 34, 40, 0.08);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .hud input { width: 16px; height: 16px; margin: 0; accent-color: #0073e6; cursor: pointer; }
  @media (prefers-color-scheme: dark) {
    .hud { color: #f5f5f7; background: rgba(44, 44, 46, 0.72); box-shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.12); }
  }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="stage" aria-label="A little bird that turns its head to look at the point under the cursor."></canvas>
<label class="hud"><input type="checkbox" id="naive"> Naive: turn in bone axes</label>
<script type="module" src="../variants/js/main.js"></script>
</body>
</html>
