<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Error Fix Capsule</title>
<link rel="stylesheet" href="../variants/html/fix-capsule.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    display: grid; grid-template-columns: minmax(0, 420px); justify-content: center; align-content: center;
    padding: 24px 16px; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #1d1d1f;
  }
  .card {
    box-sizing: border-box; padding: 22px 22px 18px; border-radius: 22px; background: #ffffff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 10px 30px rgba(0, 0, 0, 0.06);
  }
  .done { display: grid; justify-items: center; gap: 8px; padding: 36px 8px 28px; text-align: center; }
  .done[hidden] { display: none; }
  .done__icon { display: grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: #34c759; color: #fff; }
  .done__icon svg { width: 26px; height: 26px; }
  .done h2 { margin: 6px 0 0; font-size: 20px; letter-spacing: -0.01em; }
  .done p { margin: 0; color: #636366; font-size: 14px; overflow-wrap: anywhere; }
  .demo-bar { display: flex; justify-content: center; margin-top: 14px; }
  .demo-btn {
    height: 32px; padding: 0 14px; border: 0; border-radius: 999px; cursor: pointer; color: inherit;
    background: rgba(118, 118, 128, 0.14); font: 500 13px/1 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .demo-btn:hover { background: rgba(118, 118, 128, 0.22); }
  .demo-btn:focus-visible { outline: 2px solid #0a84ff; outline-offset: 2px; }
  html.is-shot .demo-bar { visibility: hidden; }
  @media (prefers-color-scheme: dark) {
    body { color: #f5f5f7; }
    .card { background: #1c1c1e; box-shadow: none; }
    .done p { color: #aeaeb2; }
  }
  @media (max-width: 420px) { body { padding: 54px 12px 16px; align-content: start; } .card { padding: 18px 16px 14px; } }
</style>
</head>
<body>
<main>
  <div class="card">
    <form class="efc" novalidate aria-labelledby="efc-title">
      <h1 class="efc__title" id="efc-title">Create your account</h1>
      <p class="efc__sub">Free for 30 days. No card needed.</p>
      <div class="efc-field">
        <label for="efc-name">Full name</label>
        <input class="efc-input" id="efc-name" name="name" autocomplete="name" required data-missing="Enter your full name.">
        <span class="efc-mark" aria-hidden="true"><svg class="efc-mark__bad" viewBox="0 0 12 12" fill="currentColor"><rect x="5.1" y="2.4" width="1.8" height="4.8" rx=".9"/><circle cx="6" cy="9.1" r="1"/></svg><svg class="efc-mark__ok" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 6.2l2.2 2.2 4.6-4.8"/></svg></span>
      </div>
      <div class="efc-field">
        <label for="efc-email">Work email</label>
        <input class="efc-input" id="efc-email" name="email" type="email" autocomplete="email" required data-check="email" data-missing="Enter your email." value="mara.lindqvist@gmial.com">
        <span class="efc-mark" aria-hidden="true"><svg class="efc-mark__bad" viewBox="0 0 12 12" fill="currentColor"><rect x="5.1" y="2.4" width="1.8" height="4.8" rx=".9"/><circle cx="6" cy="9.1" r="1"/></svg><svg class="efc-mark__ok" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 6.2l2.2 2.2 4.6-4.8"/></svg></span>
      </div>
      <div class="efc-field">
        <label for="efc-phone">Phone</label>
        <input class="efc-input" id="efc-phone" name="phone" type="tel" autocomplete="tel" required data-check="phone" data-country-code="+31" data-missing="Enter a phone number." value="06 1234 5678">
        <span class="efc-mark" aria-hidden="true"><svg class="efc-mark__bad" viewBox="0 0 12 12" fill="currentColor"><rect x="5.1" y="2.4" width="1.8" height="4.8" rx=".9"/><circle cx="6" cy="9.1" r="1"/></svg><svg class="efc-mark__ok" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 6.2l2.2 2.2 4.6-4.8"/></svg></span>
      </div>
      <div class="efc-field">
        <label for="efc-site">Website <small>optional</small></label>
        <input class="efc-input" id="efc-site" name="website" inputmode="url" autocomplete="url" data-check="web" value="studio lindqvist.nl">
        <span class="efc-mark" aria-hidden="true"><svg class="efc-mark__bad" viewBox="0 0 12 12" fill="currentColor"><rect x="5.1" y="2.4" width="1.8" height="4.8" rx=".9"/><circle cx="6" cy="9.1" r="1"/></svg><svg class="efc-mark__ok" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 6.2l2.2 2.2 4.6-4.8"/></svg></span>
      </div>
      <div class="efc-field">
        <label for="efc-note">Anything we should know? <small>optional</small></label>
        <textarea class="efc-input" id="efc-note" name="note" rows="1" placeholder="Team size, tools you use…"></textarea>
      </div>
      <div class="efc__foot">
        <button class="efc__send" type="submit">Create account</button>
        <div class="efc-capsule" hidden>
          <span class="efc-capsule__dot" aria-hidden="true"></span>
          <span class="efc-num" aria-hidden="true"></span>
          <span class="efc-capsule__label" aria-hidden="true">fields to fix</span>
          <button class="efc-capsule__next" type="button"><span>Next</span><svg viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 3l4 4-4 4"/></svg></button>
        </div>
      </div>
      <p class="efc__live efc-sr" aria-live="polite"></p>
      <div class="efc-hint" popover="manual"><p class="efc-hint__msg" id="efc-hint-msg"></p><div class="efc-hint__acts"></div></div>
    </form>
    <div class="done" hidden role="status">
      <span class="done__icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 12.5l4.2 4.2 8.8-9.2"/></svg></span>
      <h2>Account created</h2>
      <p class="done__text"></p>
    </div>
  </div>
  <div class="demo-bar"><button class="demo-btn" type="button">Reset demo</button></div>
</main>
<script src="../variants/html/fix-capsule.js"></script>
<script>
  (() => {
    const form = document.querySelector("form.efc");
    const done = document.querySelector(".done");
    form.addEventListener("submit", (e) => {
      e.preventDefault();
      form.hidden = true;
      done.hidden = false;
      done.querySelector(".done__text").textContent = `We sent a sign-in link to ${form.elements.email.value}.`;
    });
    document.querySelector(".demo-btn").addEventListener("click", () => {
      form.efc.reset();
      form.hidden = false;
      done.hidden = true;
    });
    // ?shot=1: poster frame after a send attempt, the name typed in, the email typo hint open with its fix
    if (new URLSearchParams(location.search).has("shot")) {
      document.documentElement.classList.add("is-shot");
      form.efc.attempt({ "efc-name": "Mara Lindqvist" }, "efc-email");
    }
  })();
</script>
</body>
</html>
