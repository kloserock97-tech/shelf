<figure class="csk" data-state="loading" aria-labelledby="csk-title">
  <header class="csk__head">
    <div>
      <h2 class="csk__title" id="csk-title">Orders per day</h2>
      <p class="csk__sub">Last 30 days</p>
    </div>
    <p class="csk__kpi"><span class="csk__kpi-value"></span><span class="csk__kpi-note"></span></p>
  </header>
  <div class="csk__body">
    <div class="csk__plot" role="group" aria-roledescription="line chart" aria-labelledby="csk-title" aria-describedby="csk-status"></div>
    <div class="csk__panel" hidden>
      <span class="csk__icon" aria-hidden="true">
        <svg class="is-empty" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M7 15l3.5-3.5 3 2.5L19 8" stroke-dasharray="1.5 3"/></svg>
        <svg class="is-error" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4v16h16"/><path d="M7 15l3.5-3.5 2 1.7"/><path d="M15.5 9.5L19 6"/><path d="M14 16.5v.01M14 12.5v2"/></svg>
      </span>
      <p class="csk__panel-title"></p>
      <p class="csk__panel-text"></p>
      <div class="csk__actions"></div>
    </div>
  </div>
  <p class="csk__status" id="csk-status" role="status"></p>
</figure>

<link rel="stylesheet" href="chart-skeleton.css">
<script type="module">
  import { chartSkeleton } from './chart-skeleton.js';

  const dates = Array.from({ length: 30 }, (_, i) => new Date(2026, 8, 10 + i));
  const num = new Intl.NumberFormat('en-US');
  const chart = chartSkeleton(document.querySelector('.csk'), {
    dates,
    expected: [90, 190],            // the usual range: last period, a target
    format: (v) => num.format(Math.round(v)),
    formatDate: (d, style) => d.toLocaleDateString('en-US', style === 'long' ? { weekday: 'short', month: 'short', day: 'numeric' } : { month: 'short', day: 'numeric' })
  });

  async function load() {
    chart.loading();
    try {
      const values = await fetch('/api/orders?days=30').then((r) => r.json());
      if (!values.length) return chart.empty({ title: 'No orders yet', text: 'Orders show up here about a minute after checkout.', action: { label: 'Refresh', onClick: load } });
      chart.data(values, { kpi: num.format(values.reduce((a, b) => a + b, 0)), kpiNote: 'orders in 30 days' });
    } catch {
      chart.error({ title: 'Couldn’t load orders', text: 'The server didn’t answer in 10 seconds. Nothing is lost.', action: { label: 'Try again', onClick: load } });
    }
  }
  load();
</script>
