<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Insight Spotlight</title>
<link rel="stylesheet" href="../variants/html/insight-spotlight.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 20px 12px; box-sizing: border-box;
    font: clamp(13px, 0.7vw + 7px, 16px)/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  main { width: min(60em, 100%); }
</style>
</head>
<body>
<main>
  <figure class="is" id="is" aria-labelledby="is-title">
    <header class="is__head">
      <div>
        <p class="is__eyebrow">Online store · April to September</p>
        <h1 class="is__title" id="is-title">Daily orders</h1>
      </div>
      <p class="is__readout" aria-hidden="true"></p>
    </header>
    <div class="is__plot" tabindex="0" role="img" aria-labelledby="is-title" aria-describedby="is-desc"></div>
    <div class="is__bar"></div>
    <div class="is__sr" id="is-desc"></div>
    <p class="is__live" role="status"></p>
  </figure>
</main>

<script type="module">
  import { insightSpotlight } from '../variants/html/insight-spotlight.js';

  // Seeded numbers: Hash Kit's mixer over a Weyl sequence.
  function hashU(x) {
    x ^= x >>> 16; x = Math.imul(x, 0x3f9c86cb);
    x ^= x >>> 14; x = Math.imul(x, 0x1ae9dacf);
    x ^= x >>> 15;
    return x >>> 0;
  }
  function makeRandom(seed) {
    let s = seed >>> 0;
    return () => { s = (s + 0xb31c96c9) >>> 0; return hashU(s) / 4294967296; };
  }
  const rnd = makeRandom(611);
  const gauss = () => { let u = 0; while (u === 0) u = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * rnd()); };

  // 182 days from Wed, Apr 1: a slow climb that speeds up in mid-June, a weekly rhythm with busy Saturdays,
  // and one bad day in July when checkout was down for half the day.
  const N = 182, BREAK = 75, OUTAGE = 99;
  const WEEK = [1.0, 0.95, 0.89, 0.94, 0.99, 1.06, 1.2]; // Sun … Sat
  const dates = Array.from({ length: N }, (_, i) => new Date(2026, 3, 1 + i));
  const values = dates.map((d, i) => {
    const level = 820 + 3.2 * Math.min(i, BREAK) + 10.5 * Math.max(0, i - BREAK);
    const v = level * WEEK[d.getDay()] * (1 + 0.035 * gauss()) * (i === OUTAGE ? 0.57 : 1);
    return Math.round(v);
  });

  const num = new Intl.NumberFormat('en-US');
  const q = new URLSearchParams(location.search);
  insightSpotlight(document.querySelector('#is'), {
    values, dates, unit: 'orders',
    format: (v) => num.format(Math.round(v)),
    // ?shot=1 — the tour open at the trend change; ?step=N — any step
    initialStep: q.get('shot') === '1' ? 0 : q.has('step') ? Number(q.get('step')) : undefined
  });
</script>
</body>
</html>
