<title>Procedural Tree and Rocks</title>

    font: 500 13px/1.2 Onest, "Segoe UI", Roboto, sans-serif; white-space: nowrap;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
</style>

</head>
