<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Inline Slot Picker</title>
<link rel="stylesheet" href="../variants/html/slot-picker.css">
<style>
  html, body { margin: 0; background: transparent; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; grid-template-columns: minmax(0, 560px); justify-content: center; align-content: center; padding: 28px 16px; box-sizing: border-box; }
  .card { box-sizing: border-box; width: 100%; min-width: 0; padding: 22px 22px 20px; border-radius: 20px; background: var(--spk-surface); }
  .card__title { margin: 0 0 4px; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; }
  @media (max-width: 520px) {
    body { padding: 54px 12px 16px; align-content: start; }
    .card { padding: 18px 16px 16px; border-radius: 18px; }
  }
</style>
</head>
<body>
<section class="spk card" aria-labelledby="spk-title">
  <script type="application/json" class="spk-config">
    {
      "host": "Alex",
      "hostTimeZone": "Europe/Berlin",
      "email": "hello@example.com",
      "subject": "Intro call",
      "minutes": 20,
      "step": 30,
      "days": 7,
      "leadHours": 3,
      "takenShare": 0.3,
      "seed": 7,
      "week": {
        "mon": ["10:00-12:00", "15:00-17:30"],
        "tue": ["09:30-12:00", "16:00-18:00"],
        "wed": ["10:00-12:00", "14:00-16:00"],
        "thu": ["13:00-17:30"],
        "fri": ["10:00-12:30"]
      }
    }
  </script>
  <h1 class="card__title" id="spk-title">Book a 20-minute intro call</h1>
  <p class="spk-clock"></p>
  <div class="spk-days" role="radiogroup" aria-label="Day"></div>
  <p class="spk-zone"></p>
  <div class="spk-slots" role="radiogroup" aria-label="Start time"></div>
  <div class="spk-pick" hidden></div>
  <p class="spk-status" role="status"></p>
</section>
<script src="../variants/html/slot-picker.js"></script>
<script>
  // ?tz=America/New_York — pretend to be a visitor in that zone; ?now=2026-10-14T12:20:00Z — pin the clock.
  // ?shot=1 — poster state: a fixed Wednesday, a visitor in New York, Thursday open with a slot picked.
  (() => {
    const q = new URLSearchParams(location.search);
    const box = document.querySelector('.spk');
    const shot = q.has('shot');
    const tz = q.get('tz') || (shot ? 'America/New_York' : '');
    const now = q.get('now') || (shot ? '2026-10-14T12:20:00Z' : '');
    try { if (tz) { new Intl.DateTimeFormat('en', { timeZone: tz }); box.dataset.visitorTz = tz; } } catch {}
    if (now && Number.isFinite(Date.parse(now))) box.dataset.now = now;
    if (shot) { box.dataset.locale = 'en-GB'; box.dataset.hourCycle = 'h23'; }
    document.addEventListener('DOMContentLoaded', () => { if (shot && box.spk) box.spk.show(0, 2); });
  })();
</script>
</body>
</html>
