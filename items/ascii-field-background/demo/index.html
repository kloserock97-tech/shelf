<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>ASCII Field</title>
<link rel="stylesheet" href="../variants/html/ascii-field.css">
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    position: relative; display: grid; place-items: center;
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #1f1d1a;
  }
  .ascii-field { position: fixed; }
  .copy { position: relative; max-width: 420px; padding: 28px 24px; text-align: center; box-sizing: border-box; }
  .eyebrow {
    margin: 0 0 12px; font: 600 11px/1 ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    letter-spacing: .16em; text-transform: uppercase; opacity: .6;
  }
  h1 { margin: 0; font-size: clamp(34px, 8vw, 54px); line-height: 1; letter-spacing: -.03em; font-weight: 800; }
  p { margin: 14px auto 22px; max-width: 30ch; opacity: .72; }
  a.button {
    display: inline-block; padding: 11px 20px; border-radius: 999px; text-decoration: none; font-weight: 600;
    background: #1f1d1a; color: #f8f5ef;
  }
  a.button:focus-visible { outline: 2px solid #3b5a8c; outline-offset: 3px; }
  @media (prefers-color-scheme: dark) {
    body { color: #ede8df; }
    a.button { background: #ede8df; color: #191816; }
    a.button:focus-visible { outline-color: #9db6dd; }
  }
</style>
</head>
<body>
<canvas class="ascii-field" aria-hidden="true"></canvas>
<main class="copy">
  <p class="eyebrow">Field notes · 04</p>
  <h1>Quiet signals</h1>
  <p>A background that breathes in characters. Move the pointer to part them.</p>
  <a class="button" href="#notes">Read the notes</a>
</main>
<script type="module">
  import { createAsciiField } from "../variants/html/ascii-field.js";

  const shot = new URLSearchParams(location.search).has("shot");
  const field = createAsciiField(document.querySelector(".ascii-field"), {
    fontSize: innerWidth < 560 ? 11 : 13,
    quiet: document.querySelector(".copy"),
    frozen: shot
  });
  if (field && shot) {
    // a still frame: the light band near the middle and a pointer parting the field at the right
    field.pose(20.5, { x: innerWidth * 0.8, y: innerHeight * 0.62, strength: 1 });
  }
</script>
</body>
</html>
