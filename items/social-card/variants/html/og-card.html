<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1200">
<title>Link preview card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- display=block: the shot waits for the real font instead of catching the fallback -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@300;400;500&display=block">
<link rel="stylesheet" href="og-card.css">
<style>html, body { margin: 0; } body { width: 1200px; height: 630px; overflow: hidden; }</style>
</head>
<body>
<div class="og-frame">
  <article class="og" aria-label="Alex Morgan, product designer">
    <div class="og__art"></div>
    <div class="og__veil"></div>
    <div class="og__mark" aria-hidden="true">AM</div>
    <div class="og__wrap">
      <p class="og__kicker">Product designer</p>
      <div>
        <h1>Alex <b>Morgan</b></h1>
        <p class="og__role">Complex products and AI services, from research to final screens.</p>
      </div>
      <div class="og__foot">
        <span class="og__chip">Research</span><span class="og__chip">Design systems</span><span class="og__chip">AI products</span><span class="og__chip">Prototyping</span>
        <span class="og__url">example.com</span>
      </div>
    </div>
  </article>
</div>
</body>
</html>
