<!-- Link preview. og:image is a separate 1200×630 card (og-card.html, shot with shoot.mjs).
     JPEG, not WebP: LinkedIn and some messengers don't unfurl a WebP preview.
     Addresses must be absolute: crawlers don't resolve relative ones.
     If the page switches language on the fly, update og:title and og:description with it. -->
<meta property="og:site_name" content="Alex Morgan">
<meta property="og:title" content="Alex Morgan — Product Designer">
<meta property="og:description" content="Complex products and AI services, from research to final screens.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="ru_RU">
<meta property="og:url" content="https://example.com/">
<meta property="og:image" content="https://example.com/og-cover.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Alex Morgan, product designer: green hills at dusk">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Alex Morgan — Product Designer">
<meta name="twitter:description" content="Complex products and AI services, from research to final screens.">
<meta name="twitter:image" content="https://example.com/og-cover.jpg">
<meta name="twitter:image:alt" content="Alex Morgan, product designer: green hills at dusk">
<link rel="canonical" href="https://example.com/">
