<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Scrub KPI Sparkline</title>
<link rel="stylesheet" href="../variants/html/scrub-kpi.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; box-sizing: border-box;
    font: clamp(14px, 0.9vw + 6px, 17px)/1.35 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
  }
  main { width: min(38em, 100%); display: grid; gap: 1em; }
  .hint { margin: 0; text-align: center; color: #636366; font-size: 0.8em; }
  @media (prefers-color-scheme: dark) { .hint { color: #aaaaaf; } }
</style>
</head>
<body>
<main>
  <section class="kpi" id="kpi" aria-labelledby="kpi-title" data-scrubbing="false">
    <header class="kpi__head">
      <h1 class="kpi__title" id="kpi-title">Monthly recurring revenue</h1>
      <div class="kpi__ranges" role="group" aria-label="Range">
        <button type="button" data-days="30" aria-pressed="false">1M</button>
        <button type="button" data-days="91" aria-pressed="true">3M</button>
        <button type="button" data-days="365" aria-pressed="false">1Y</button>
      </div>
    </header>
    <p class="kpi__date"></p>
    <p class="kpi__value"><span class="kpi__digits" aria-hidden="true"></span><span class="kpi__sr"></span></p>
    <p class="kpi__meta"><span class="kpi__delta"></span> <span class="kpi__context"></span></p>
    <div class="kpi__chart" tabindex="0" role="slider" aria-label="Day"></div>
    <div class="kpi__axis" aria-hidden="true"><span></span><span></span></div>
  </section>
  <p class="hint">Hover the line, or long-press and slide. Arrow keys step through days.</p>
</main>

<script type="module">
  import { scrubKpi } from '../variants/html/scrub-kpi.js';

  // A year of daily MRR for a small SaaS, from our own seeded hash (Hash Kit's mixer).
  function hashU(x) {
    x ^= x >>> 16; x = Math.imul(x, 0x3f9c86cb);
    x ^= x >>> 14; x = Math.imul(x, 0x1ae9dacf);
    x ^= x >>> 15;
    return x >>> 0;
  }
  const unit = (i) => hashU((i + 0xb31c96c9) >>> 0) / 4294967296;
  const TODAY = new Date(2026, 8, 30);
  const YEAR = [];
  let v = 30650;
  for (let i = 0; i < 365; i++) {
    const a = unit(41000 + i * 2);
    const b = unit(41000 + i * 2 + 1);
    const trend = 66 + 38 * Math.sin((i - 40) / 61); // net new MRR a day, drifting with the season
    const noise = (a - 0.5) * 300;
    const churn = b < 0.03 ? -(420 + b * 26000) : 0; // now and then a big account leaves
    const launch = i === 262 ? 1450 : 0;              // annual plans go live
    v += trend + noise + churn + launch;
    const date = new Date(TODAY);
    date.setDate(TODAY.getDate() - (364 - i));
    YEAR.push({ date, value: Math.round(v) });
  }

  const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD', maximumFractionDigits: 0 });
  const pct = new Intl.NumberFormat('en-US', { style: 'percent', minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const MINUS = '−';
  const signed = (s, neg) => (neg ? MINUS : '+') + s.replace('-', '');
  const fmt = {
    format: (n) => money.format(n),
    formatDelta: (d, r) => `${signed(money.format(Math.abs(d)), d < 0)} (${signed(pct.format(Math.abs(r)), r < 0)})`,
    formatDate(date, mode) {
      const sameYear = date.getFullYear() === TODAY.getFullYear();
      if (mode === 'full') return date.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
      if (mode === 'today') return `Today, ${date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })}`;
      if (mode === 'axis') {
        if (+date === +TODAY) return 'Today';
        return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', ...(sameYear ? {} : { year: 'numeric' }) });
      }
      return date.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', ...(sameYear ? {} : { year: 'numeric' }) });
    }
  };
  const LABEL = { 30: 'past month', 91: 'past 3 months', 365: 'past year' };
  const slice = (days) => YEAR.slice(YEAR.length - days);

  const root = document.querySelector('#kpi');
  const kpi = scrubKpi(root, { points: slice(91), restLabel: LABEL[91], ...fmt });

  root.querySelectorAll('.kpi__ranges button').forEach((b) => b.addEventListener('click', () => {
    root.querySelectorAll('.kpi__ranges button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    kpi.setPoints(slice(Number(b.dataset.days)), LABEL[b.dataset.days]);
  }));

  // ?shot=1 — frozen mid-scrub on a dip, for the poster
  if (new URLSearchParams(location.search).get('shot') === '1') kpi.scrubTo(27);
</script>
</body>
</html>
