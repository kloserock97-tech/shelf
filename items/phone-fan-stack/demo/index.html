<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Phone Fan Stack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<link rel="stylesheet" href="../variants/html/fan.css">
<style>
  :root { --ink: #1d1d1f; --soft: #6e6e73; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f5f5f7; --soft: #a1a1a6; }
    .fan-fig { --s1: #2c2c30; --s2: #1c1c1f; }
  }
  html, body { margin: 0; background: transparent; }
  body {
    display: grid; place-items: center; min-height: 100svh; box-sizing: border-box; padding: 24px 16px;
    font-family: Onest, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(100%, 1000px); }
  h1 { margin: 0 0 16px; font-size: clamp(20px, 1.9vw, 26px); font-weight: 600; line-height: 1.2; letter-spacing: -0.012em; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Welcome, today and a plant card</h1>
  <figure class="fan-fig">
    <div class="fan">
      <button type="button" class="fan-phone"><img src="phone-welcome.svg" width="402" height="874" alt="Welcome: what the app is for comes first, the sign-up after" decoding="async"></button>
      <button type="button" class="fan-phone is-device"><img src="phone-today-device.svg" width="650" height="1321" alt="Today: a ring shows how many plants are still waiting" decoding="async"></button>
      <button type="button" class="fan-phone"><img src="phone-plant.svg" width="402" height="874" alt="Plant card: soil moisture and the next watering" decoding="async"></button>
    </div>
    <figcaption>Welcome: what the app is for comes first · Today: a ring shows what's left · Plant card: moisture and the next watering</figcaption>
  </figure>
</div>
<dialog class="fan-view" aria-label="Screen">
  <img alt="">
  <p></p>
  <button type="button" aria-label="Close">×</button>
</dialog>
<script src="../variants/html/fan.js"></script>
</body>
</html>
