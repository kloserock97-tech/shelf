<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Drum Wheel Picker</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="../variants/html/drum-picker.css">
<style>
  :root { --ink: #1d1d1f; --ink-2: #636366; --ink-3: #8e8e93; --card: #ffffff; --fill: rgba(118, 118, 128, 0.12); --accent: #0071e3; --on-accent: #ffffff; --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 8px 28px rgba(0, 0, 0, 0.07); }
  @media (prefers-color-scheme: dark) { :root { --ink: #f5f5f7; --ink-2: #a1a1a6; --ink-3: #6e6e73; --card: #1c1c1e; --fill: rgba(118, 118, 128, 0.24); --accent: #2997ff; --on-accent: #000000; --shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.08); } }
  html, body { margin: 0; background: transparent; }
  body { min-height: 100vh; min-height: 100dvh; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased; }
  .screen { box-sizing: border-box; max-width: 430px; margin: 0 auto; padding: 54px 12px 24px; }
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding: 10px 6px 14px; }
  .head h1 { margin: 0; font-size: 32px; line-height: 1.05; font-weight: 700; letter-spacing: -0.02em; }
  .head p { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); }
  .mute { flex: none; width: 36px; height: 36px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 50%; background: var(--fill); color: var(--ink); cursor: pointer; }
  .mute svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .mute:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .mute .off { display: none; }
  .mute[aria-pressed="false"] .on { display: none; }
  .mute[aria-pressed="false"] .off { display: block; }

  .card { padding: 16px 12px 14px; border-radius: 22px; background: var(--card); box-shadow: var(--shadow); }
  .card__row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px 6px 12px; }
  .card__label { font-size: 15px; font-weight: 600; }
  .card__value { font-size: 15px; color: var(--accent); font-variant-numeric: tabular-nums; text-align: right; }
  .dp { margin: 0 2px; }
  .card__note { margin: 12px 6px 4px; font-size: 13px; line-height: 1.4; color: var(--ink-2); }
  .done { display: block; width: 100%; margin-top: 14px; padding: 14px; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font: 600 16px/1 system-ui, -apple-system, "Segoe UI", sans-serif; cursor: pointer; }
  .done:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .hint { margin: 14px 6px 0; font-size: 12px; line-height: 1.45; color: var(--ink-3); }
</style>
</head>
<body>
<main class="screen">
  <header class="head">
    <div>
      <h1>Delivery</h1>
      <p>Order 4127 · 2 boxes</p>
    </div>
    <button class="mute" type="button" aria-pressed="true" aria-label="Sound">
      <svg class="on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9a4 4 0 0 1 0 6"/><path d="M18 6.5a7.5 7.5 0 0 1 0 11"/></svg>
      <svg class="off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M16 9.5l5 5M21 9.5l-5 5"/></svg>
    </button>
  </header>

  <section class="card" aria-labelledby="dp-label">
    <div class="card__row">
      <span class="card__label" id="dp-label">Date</span>
      <output class="card__value" id="dp-out" aria-live="polite"></output>
    </div>
    <div class="dp" aria-label="Delivery date" data-manual></div>
    <p class="card__note">Courier window 9:00–13:00. A day the month does not have rolls back on its own.</p>
    <button class="done" type="button">Confirm date</button>
  </section>
  <p class="hint">Flick a wheel or drag it with the mouse. Keyboard: Tab to a wheel, ↑ ↓ change it, ← → move between wheels.</p>
</main>

<script src="../variants/html/drum-picker.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const shot = q.has('shot');
  const root = document.querySelector('.dp');
  const start = shot ? new Date(2027, 1, 27) : new Date(2026, 10, 14);
  const picker = DrumPicker.date(root, { value: start, from: 1990, to: 2040 });
  const out = document.querySelector('#dp-out');
  const fmt = new Intl.DateTimeFormat('en-GB', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' });
  const show = (d) => { out.textContent = fmt.format(d); };
  show(picker.value);
  const done = document.querySelector('.done');
  root.addEventListener('change', (e) => { show(e.detail.date); done.textContent = 'Confirm date'; });
  done.addEventListener('click', () => { done.textContent = `Booked for ${fmt.format(picker.value)}`; });

  const mute = document.querySelector('.mute');
  mute.addEventListener('click', () => {
    const on = mute.getAttribute('aria-pressed') !== 'true';
    mute.setAttribute('aria-pressed', String(on));
    root.dataset.sound = on ? 'on' : 'off';
  });

  // ?shot=1: February 2027 (29–31 greyed out), the day wheel caught between two rows
  if (shot) {
    const day = picker.wheels.day.el;
    day.classList.add('is-dragging');
    picker.wheels.day.dragging = true;
    day.scrollTop += 36 * 0.45;
  }
</script>
</body>
</html>
