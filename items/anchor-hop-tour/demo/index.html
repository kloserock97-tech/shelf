<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Anchor-Hop Product Tour</title>
<link rel="stylesheet" href="../variants/html/anchor-tour.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    display: grid; grid-template-columns: minmax(0, 720px); justify-content: center; align-content: center;
    padding: 24px 16px; font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    --label: #1d1d1f; --label-2: #6e6e73; --label-3: #8e8e93; --surface: #ffffff; --side: #f6f6f8;
    --fill: rgba(118, 118, 128, 0.12); --fill-2: rgba(118, 118, 128, 0.2); --hair: rgba(0, 0, 0, 0.09); --accent: #0073e6;
    color: var(--label);
  }
  @media (prefers-color-scheme: dark) {
    body {
      --label: #f5f5f7; --label-2: #aeaeb2; --label-3: #7c7c80; --surface: #1c1c1e; --side: #232325;
      --fill: rgba(118, 118, 128, 0.24); --fill-2: rgba(118, 118, 128, 0.34); --hair: rgba(255, 255, 255, 0.09); --accent: #0a84ff;
    }
  }
  svg { display: block; flex: none; }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* mock app: the tour root */
  .app {
    position: relative; overflow: clip; border-radius: 18px; border: 1px solid var(--hair);
    display: grid; grid-template-columns: 176px minmax(0, 1fr); grid-template-rows: 54px minmax(0, 1fr);
    height: 470px; background: var(--surface);
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 14px 40px rgba(0, 0, 0, 0.08);
  }
  .bar { grid-column: 1 / -1; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--hair); }
  .brand { display: flex; align-items: center; gap: 8px; width: 150px; font-weight: 650; letter-spacing: -0.01em; }
  .brand__mark { width: 24px; height: 24px; border-radius: 7px; background: linear-gradient(135deg, #5e5ce6, #0a84ff); }
  .search {
    display: flex; align-items: center; gap: 8px; flex: 1; max-width: 300px; height: 34px; padding: 0 10px;
    border: 0; border-radius: 10px; background: var(--fill); color: var(--label-3); cursor: pointer; text-align: left;
  }
  .search span { flex: 1; }
  .search kbd { font: 600 11px/1 inherit; padding: 3px 6px; border-radius: 5px; background: var(--surface); color: var(--label-2); }
  .bar__end { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .share {
    display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 1px solid var(--hair);
    border-radius: 9px; background: transparent; cursor: pointer; font-weight: 550;
  }
  .avatar { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: #ff9f0a; color: #fff; font-size: 12px; font-weight: 700; }
  .side { display: flex; flex-direction: column; gap: 2px; padding: 12px 8px; background: var(--side); border-right: 1px solid var(--hair); }
  .nav {
    display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border: 0; border-radius: 9px;
    background: transparent; cursor: pointer; text-align: left; color: var(--label-2);
  }
  .nav:hover { background: var(--fill); }
  .nav[aria-current="page"] { background: var(--fill-2); color: var(--label); font-weight: 600; }
  .nav__label { flex: 1; }
  .nav__count { font-size: 12px; color: var(--label-3); font-variant-numeric: tabular-nums; }
  .side__end { margin-top: auto; }
  .main { padding: 18px 20px; overflow: hidden; }
  .main__head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .main__title { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .new {
    display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 14px 0 10px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; font-weight: 600; cursor: pointer;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin: 0; padding: 0; list-style: none; }
  .proj { border: 1px solid var(--hair); border-radius: 12px; overflow: hidden; transition: opacity 300ms ease, translate 400ms cubic-bezier(.23, 1, .32, 1); }
  @starting-style { .proj { opacity: 0; translate: 0 8px; } }
  .proj__cover { height: 54px; }
  .proj__body { padding: 9px 11px 11px; }
  .proj__name { font-weight: 600; font-size: 13.5px; }
  .proj__meta { font-size: 12px; color: var(--label-3); }
  .proj__bar { height: 4px; margin-top: 8px; border-radius: 2px; background: var(--fill); overflow: hidden; }
  .proj__bar i { display: block; height: 100%; border-radius: 2px; background: var(--label-3); }
  .icon { width: 18px; height: 18px; }

  .demo-bar { display: flex; justify-content: center; margin-top: 14px; }
  .demo-btn { height: 32px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--fill); cursor: pointer; font-size: 13px; font-weight: 500; }
  .demo-btn:hover { background: var(--fill-2); }
  html.is-shot .demo-bar { visibility: hidden; }

  @media (max-width: 600px) {
    body { padding: 24px 12px; align-content: start; }
    .app { grid-template-columns: 56px minmax(0, 1fr); height: 540px; }
    .brand { width: auto; }
    .brand__name, .nav__label, .nav__count, .search kbd, .share span { display: none; }
    .nav { justify-content: center; padding: 0; }
    .search { max-width: none; }
    .share { padding: 0 9px; }
    .main { padding: 14px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .proj__cover { height: 36px; }
  }
</style>
</head>
<body>
<main>
  <div class="app" id="app">
    <header class="bar">
      <div class="brand"><span class="brand__mark" aria-hidden="true"></span><span class="brand__name">Notebook</span></div>
      <button class="search" type="button" aria-keyshortcuts="/">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="8.6" cy="8.6" r="5.6"/><path d="M12.8 12.8l4 4"/></svg>
        <span>Search</span><kbd>/</kbd>
      </button>
      <div class="bar__end">
        <button class="share" type="button" aria-label="Share">
          <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 12.5V3M6.5 6.5L10 3l3.5 3.5M4 10.5v5a1.5 1.5 0 0 0 1.5 1.5h9a1.5 1.5 0 0 0 1.5-1.5v-5"/></svg>
          <span>Share</span>
        </button>
        <span class="avatar" aria-hidden="true">MK</span>
      </div>
    </header>
    <nav class="side" aria-label="Sections">
      <button class="nav" type="button">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M3 11.5l2-7h10l2 7v4a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 3 15.5z"/><path d="M3 11.5h4l1 2h4l1-2h4"/></svg>
        <span class="nav__label">Inbox</span><span class="nav__count">4</span>
      </button>
      <button class="nav nav--projects" type="button" aria-current="page">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6a1.5 1.5 0 0 1 1.5-1.5h3.6l1.6 2h6.8A1.5 1.5 0 0 1 17.5 8v6.5A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5z"/></svg>
        <span class="nav__label">Projects</span><span class="nav__count">3</span>
      </button>
      <button class="nav" type="button">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M10 2.9l2 4.9 5.3.4-4 3.4 1.2 5.1L10 13.9l-4.5 2.8 1.2-5.1-4-3.4 5.3-.4z"/></svg>
        <span class="nav__label">Starred</span>
      </button>
      <button class="nav" type="button">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="3.5" width="15" height="4" rx="1"/><path d="M4 7.5v8A1.5 1.5 0 0 0 5.5 17h9a1.5 1.5 0 0 0 1.5-1.5v-8M8 10.5h4"/></svg>
        <span class="nav__label">Archive</span>
      </button>
      <button class="nav side__end" type="button">
        <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2.2M10 15.3v2.2M2.5 10h2.2M15.3 10h2.2M4.7 4.7l1.6 1.6M13.7 13.7l1.6 1.6M4.7 15.3l1.6-1.6M13.7 6.3l1.6-1.6"/></svg>
        <span class="nav__label">Settings</span>
      </button>
    </nav>
    <section class="main" aria-labelledby="main-title">
      <div class="main__head">
        <h1 class="main__title" id="main-title">Projects</h1>
        <button class="new" type="button">
          <svg class="icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M10 4.5v11M4.5 10h11"/></svg>
          New project
        </button>
      </div>
      <ul class="grid">
        <li class="proj"><div class="proj__cover" style="background: linear-gradient(120deg, #ffd60a, #ff9f0a)"></div><div class="proj__body"><div class="proj__name">Spring launch</div><div class="proj__meta">18 notes · edited 2h ago</div><div class="proj__bar"><i style="width: 72%"></i></div></div></li>
        <li class="proj"><div class="proj__cover" style="background: linear-gradient(120deg, #64d2ff, #5e5ce6)"></div><div class="proj__body"><div class="proj__name">Field interviews</div><div class="proj__meta">9 notes · edited yesterday</div><div class="proj__bar"><i style="width: 40%"></i></div></div></li>
        <li class="proj"><div class="proj__cover" style="background: linear-gradient(120deg, #30d158, #00a39a)"></div><div class="proj__body"><div class="proj__name">Garden plans</div><div class="proj__meta">5 notes · edited Mon</div><div class="proj__bar"><i style="width: 18%"></i></div></div></li>
      </ul>
    </section>
  </div>
  <div class="demo-bar"><button class="demo-btn" id="restart" type="button">Restart tour</button></div>
</main>
<script src="../variants/html/anchor-tour.js"></script>
<script>
  (() => {
    const app = document.getElementById('app');
    const restart = document.getElementById('restart');
    let made = 0;
    app.querySelector('.new').addEventListener('click', () => {
      const li = document.createElement('li');
      li.className = 'proj';
      li.innerHTML = '<div class="proj__cover" style="background: var(--fill-2)"></div><div class="proj__body"><div class="proj__name"></div><div class="proj__meta">Empty · just now</div><div class="proj__bar"><i style="width: 0"></i></div></div>';
      li.querySelector('.proj__name').textContent = made++ ? `Untitled project ${made}` : 'Untitled project';
      app.querySelector('.grid').prepend(li);
      if (app.querySelectorAll('.proj').length > 4) app.querySelector('.proj:last-child').remove();
    });

    const tour = anchorTour(app, [
      { target: '.search', title: 'Find anything', text: 'Search notes, projects and people. Press / from any screen.' },
      { target: '.nav--projects', title: 'Projects live here', text: 'Every project you start or join shows up in this list.' },
      { target: '.new', title: 'Start a project', text: 'Projects keep notes, files and people together.', hint: 'Click New project to go on' },
      { target: '.share', title: 'Bring your team', text: 'Share a project with a link or by email. People you invite see it right away.' }
    ], { returnFocus: restart });
    restart.addEventListener('click', () => tour.start(0));

    // ?shot=1: poster frame, step 3 on "New project": the card has flipped to fit inside the frame
    if (new URLSearchParams(location.search).has('shot')) {
      document.documentElement.classList.add('is-shot');
      tour.freeze(true);
      tour.start(2);
    } else {
      setTimeout(() => tour.start(0), 500);
    }
  })();
</script>
</body>
</html>
