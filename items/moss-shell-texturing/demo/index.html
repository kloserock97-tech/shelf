<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Moss Shell Texturing</title>
<style>
  html, body { height: 100%; margin: 0; }
  /* a grey photo studio: the wall lightens towards the floor line, the floor darkens towards the camera */
  body {
    background:
      radial-gradient(ellipse 55% 30% at 50% 62%, #c9ccd0cc 0%, #c9ccd000 100%),
      linear-gradient(180deg, #8f9398 0%, #a3a7ab 45%, #b7babd 62%, #a6a9ad 80%, #8c9094 100%);
    font: 13px/1.3 "Segoe UI", system-ui, sans-serif; color: #17181a; overflow: hidden;
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #scene:active { cursor: grabbing; }
  .panel {
    position: fixed; top: 12px; left: 12px; display: grid; gap: 8px; width: 210px; padding: 12px 14px;
    border-radius: 14px; background: #f4f5f6d9; box-shadow: 0 8px 24px #0000002e, inset 0 0 0 1px #ffffff80;
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  .panel label { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 8px; }
  .panel input[type=range] { grid-column: 1 / -1; width: 100%; margin: 0; accent-color: #3d6b1e; }
  .panel output { font-variant-numeric: tabular-nums; color: #4a4d53; }
  .panel .check { display: flex; gap: 8px; justify-content: flex-start; }
  .panel .check input { margin: 0; accent-color: #3d6b1e; }
  .panel button { justify-self: start; font: inherit; padding: 5px 12px; border-radius: 8px; border: 1px solid #17181a26; background: #fff; color: inherit; cursor: pointer; }
  .panel button:focus-visible, .panel input:focus-visible { outline: 2px solid #0a64d8; outline-offset: 2px; }
  .hint { position: fixed; top: 16px; right: 16px; margin: 0; color: #25272bcc; }
  @media (max-width: 520px) { .panel { width: 170px; padding: 10px 12px; } .hint { display: none; } }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="scene" aria-label="A mossy stone. Drag to turn it."></canvas>
<form class="panel" onsubmit="return false">
  <label>Layers <output id="layers-out">16</output><input id="layers" type="range" min="4" max="22" step="1" value="16"></label>
  <label>Strand cell <output id="cell-out">3.6 px</output><input id="cell" type="range" min="2" max="9" step="0.2" value="3.6"></label>
  <label class="check"><input id="hull" type="checkbox" checked> Hull at the tips</label>
  <label class="check"><input id="lock" type="checkbox" checked> Layers keep alpha</label>
  <button id="regrow" type="button">Regrow</button>
</form>
<p class="hint">Drag to turn</p>
<script type="module" src="app.js"></script>
</body>
</html>
