<!-- Two screens and a datamosh between them. Screens are paint functions in CSS px; drag on the stage or press the button. -->
<div class="datamosh" role="img" aria-label="Screen 1 of 2: Light" style="width: min(600px, 92vw); aspect-ratio: 4 / 3">
  <canvas aria-hidden="true"></canvas>
</div>
<button type="button" id="next">Next screen</button>

<link rel="stylesheet" href="datamosh.css">
<script type="module">
  import { createDatamosh } from './datamosh.js';

  const light = (g, w, h) => {
    g.fillStyle = '#f3eee6'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#d4643f'; g.fillRect(w * 0.08, h * 0.2, w * 0.4, h * 0.6);
    g.fillStyle = '#2f4c7c'; g.fillRect(w * 0.54, h * 0.2, w * 0.38, h * 0.28);
  };
  const dark = (g, w, h) => {
    g.fillStyle = '#18203a'; g.fillRect(0, 0, w, h);
    g.fillStyle = '#f08a4b'; g.beginPath(); g.arc(w * 0.65, h * 0.42, h * 0.22, 0, Math.PI * 2); g.fill();
  };

  const stage = document.querySelector('.datamosh');
  const mosh = createDatamosh(stage.querySelector('canvas'), [light, dark], {
    onChange: (i) => stage.setAttribute('aria-label', `Screen ${i + 1} of 2: ${i ? 'Dark' : 'Light'}`)
  });
  document.querySelector('#next').addEventListener('click', () => mosh?.play());
</script>
