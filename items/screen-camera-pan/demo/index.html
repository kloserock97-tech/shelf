<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Screen Camera Pan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">

<style>
  :root { --ink: #1d1d1f; --soft: #6e6e73; --accent: #3e63dd; }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f5f5f7; --soft: #a1a1a6; --accent: #7e9bff; }
    .dm-wrap { --s1: #2c2c30; --s2: #1c1c1f; }
  }
  html, body { margin: 0; background: transparent; }
  body {
    display: grid; place-items: center; min-height: 100svh; box-sizing: border-box; padding: 24px 16px;
    font-family: Onest, system-ui, sans-serif; color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  #demo { width: min(100%, 1060px); }
</style>
</head>

<div id="demo"></div>
