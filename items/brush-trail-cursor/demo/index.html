<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Brush Trail Cursor</title>
<link rel="stylesheet" href="../variants/html/brush-trail.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh; min-height: 100dvh; box-sizing: border-box;
    display: grid; place-content: center; grid-template-columns: minmax(0, 780px);
    padding: 24px 16px;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif;
    --paper: #fbf8f1; --ink: #2a2620; --ink-2: #7a7266; --line: #2a221a1a; --seg: #f1ece2; --seg-on: #ffffff; --focus: #2f4fb8;
    color: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    body { --paper: #1b1a18; --ink: #efe9df; --ink-2: #a39b8f; --line: #ffffff17; --seg: #272522; --seg-on: #3a3732; --focus: #9db4ff; }
  }
  .paper {
    position: relative;
    height: clamp(380px, 72vh, 560px);
    border-radius: 22px;
    background: var(--paper);
    box-shadow: 0 0 0 1px var(--line), 0 22px 50px -26px #2a221a59;
    overflow: hidden;
    cursor: crosshair;
  }
  .paper__head { position: absolute; left: 24px; top: 20px; right: 24px; pointer-events: none; }
  .paper__head h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -0.01em; }
  .paper__head p { margin: 2px 0 0; color: var(--ink-2); font-size: 13px; max-width: 34ch; }
  .tools {
    position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 8px; cursor: default;
  }
  .seg {
    display: flex; padding: 3px; gap: 2px; border: 0; margin: 0; border-radius: 999px;
    background: var(--seg); box-shadow: 0 0 0 1px var(--line);
  }
  .seg legend { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
  .seg label { position: relative; display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; cursor: pointer; font-size: 13px; font-weight: 600; color: var(--ink-2); }
  .seg input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .seg label:has(input:checked) { background: var(--seg-on); color: var(--ink); box-shadow: 0 1px 3px #0000001f, 0 0 0 1px var(--line); }
  .seg label:has(input:focus-visible) { outline: 2px solid var(--focus); outline-offset: 1px; }
  .seg svg, .clear svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .clear {
    display: flex; align-items: center; gap: 6px; padding: 9px 14px; border-radius: 999px; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink); background: var(--seg); border: 0; box-shadow: 0 0 0 1px var(--line);
  }
  .clear:hover { background: var(--seg-on); }
  .clear:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .nogl { position: absolute; inset: auto 24px 76px; margin: 0; color: var(--ink-2); font-size: 13px; text-align: center; }
  @media (max-width: 480px) {
    body { padding: 16px 12px; }
    .paper { height: clamp(420px, 78vh, 620px); }
    .seg label { padding: 7px 9px; }
    .seg label span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .clear span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    .tools { gap: 6px; }
  }
  @media (hover: none) { .hint-fine { display: none; } }
  @media (hover: hover) { .hint-touch { display: none; } }
</style>
</head>
<body>
<div class="paper" id="paper">
  <div class="paper__head">
    <h1>Brush trail</h1>
    <p><span class="hint-fine">Move the pointer over the paper. Slow strokes run wide and deep, fast ones thin and pale.</span><span class="hint-touch">Draw with a finger. Slow strokes run wide and deep, fast ones thin and pale.</span></p>
  </div>
  <div class="tools">
    <fieldset class="seg">
      <legend>Brush</legend>
      <label><input type="radio" name="brush" value="flat">
        <svg viewBox="0 0 20 20" aria-hidden="true"><rect x="6.5" y="2.5" width="7" height="9" rx="1.5"/><path d="M8 11.5v3.5M10 11.5v5M12 11.5v3.5"/></svg><span>Flat</span></label>
      <label><input type="radio" name="brush" value="bristle" checked>
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M8 2.5h4l-.5 6h-3z"/><path d="M8.5 8.5 6.5 17M9.5 8.5 9 17.5M10.5 8.5l.5 9M11.5 8.5l2 8.5"/></svg><span>Bristle</span></label>
      <label><input type="radio" name="brush" value="stamp">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3.5 16.5C4 9 9 4 16.5 3.5 16 11 11 16 3.5 16.5z"/><path d="M3.5 16.5 12 8"/></svg><span>Stamp</span></label>
    </fieldset>
    <button type="button" class="clear" id="clear">
      <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 6h12M8 6V4h4v2M6 6l.8 10h6.4L14 6"/></svg><span>Clear</span>
    </button>
  </div>
</div>

<script type="module">
  import { createBrushTrail } from '../variants/html/brush-trail.js';

  const paper = document.getElementById('paper');
  const radios = [...document.querySelectorAll('input[name="brush"]')];
  const shot = new URLSearchParams(location.search).has('shot');
  const trail = createBrushTrail(paper, { brush: 'bristle', size: shot ? 34 : 24 });
  if (!trail) {
    paper.insertAdjacentHTML('beforeend', '<p class="nogl">This browser has no WebGL2, so the paper stays clean.</p>');
  } else {
    radios.forEach((r) => r.addEventListener('change', () => trail.setBrush(r.value)));
    document.getElementById('clear').addEventListener('click', () => trail.clear());
  }

  // ?shot=1: three strokes at different ages, one per brush
  if (trail && shot) {
    const { width: w, height: h } = paper.getBoundingClientRect();
    const path = (n, f) => Array.from({ length: n + 1 }, (_, i) => f(i / n));
    trail.setBrush('flat');
    trail.paintPath(path(90, (t) => [w * (0.1 + 0.8 * t), h * (0.66 - 0.1 * Math.sin(t * 5.2)), 0.15 + 1.1 * t * t]));
    trail.age(1.6);
    trail.setBrush('stamp');
    trail.paintPath(path(70, (t) => [w * (0.16 + 0.7 * t), h * (0.84 - 0.42 * t + 0.08 * Math.sin(t * 7))]), 0.4);
    trail.age(0.9);
    trail.setBrush('bristle');
    trail.paintPath(path(120, (t) => [w * (0.08 + 0.86 * t), h * (0.38 + 0.13 * Math.sin(t * 6.6 + 0.6)), 1.5 - 1.3 * Math.sin(t * Math.PI)]));
    trail.age(0.25);
    trail.freeze();
    radios.forEach((r) => (r.checked = r.value === 'bristle'));
  }
</script>
</body>
</html>
