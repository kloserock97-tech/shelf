<!-- Write the full text once. Level-1 words are plain; each extra piece sits in a span with its level.
     Keep the leading space inside the span so the sentence reads right at every level. -->
<article class="st" data-level="1">
  <div class="st__bar">
    <h3 class="st__label">Result</h3>
    <button class="st__handle" type="button"></button>
  </div>
  <p class="st__text">Drop-off<span data-l="2"> at checkout</span> fell<span data-l="2"> from 34%</span> to 19%<span data-l="2"> in six weeks</span><span data-l="3">, and support tickets about vanished slots dropped by half</span>.</p>
</article>

<script src="stretch-text.js" defer></script>
