<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Nature Ambience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap">
<style>
  :root { --ink: light-dark(#1d1d1f, #f5f5f7); --dim: light-dark(#6e6e73, #a1a1a6); --card: light-dark(#ffffff, #1c1c1e); --line: light-dark(#0000001a, #ffffff1f); --chip: light-dark(#f0f0f3, #2c2c2e); }
  body { --accent: #6fa35f; }
  body[data-weather="cloudy"] { --accent: #7f93a8; }
  body[data-weather="rain"] { --accent: #5f82ad; }
  body[data-weather="dusk"] { --accent: #c7835f; }
  html, body { margin: 0; background: transparent; }
  body { min-height: 100vh; box-sizing: border-box; display: grid; place-items: center; padding: 16px; color: var(--ink); font: 400 13px/1.4 Onest, system-ui, sans-serif; }
  .card { box-sizing: border-box; width: min(520px, 100%); padding: 22px 22px 20px; border-radius: 24px; background: var(--card); box-shadow: 0 12px 34px #0000001f, inset 0 0 0 .5px var(--line); }
  h1 { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -.01em; }
  .sub { margin: 4px 0 16px; color: var(--dim); }
  .viz { display: block; width: 100%; height: 120px; margin-bottom: 14px; }
  .meters { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 18px; }
  .meter { display: grid; gap: 6px; color: var(--dim); font-size: 11px; }
  .meter i { position: relative; height: 4px; border-radius: 2px; background: var(--chip); overflow: hidden; }
  .meter i::after { content: ""; position: absolute; inset: 0; background: var(--accent); transform-origin: left; transform: scaleX(var(--v, 0)); }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .row + .row { margin-top: 12px; }
  button { appearance: none; border: 0; margin: 0; cursor: pointer; color: inherit; font: 500 13px/1 Onest, system-ui, sans-serif; }
  button:focus-visible, input:focus-visible { outline: 2px solid #0071e3; outline-offset: 2px; }
  .play { display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px 10px 14px; border-radius: 999px; background: var(--ink); color: var(--card); }
  .play svg { width: 16px; height: 16px; fill: currentColor; }
  .play .ic-stop, .play[aria-pressed="true"] .ic-play { display: none; }
  .play[aria-pressed="true"] .ic-stop { display: block; }
  .seg { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--chip); }
  .seg button { padding: 7px 11px; border-radius: 999px; background: transparent; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px #0000001f; }
  .ghost { display: inline-flex; align-items: center; gap: 7px; padding: 8px 13px; border-radius: 999px; background: var(--chip); }
  .ghost svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; }
  label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 180px; color: var(--dim); }
  label input { flex: 1; min-width: 0; accent-color: var(--accent); }
  .note { margin: 16px 0 0; color: var(--dim); font-size: 12px; }
</style>
</head>
<body data-weather="clear">
<main class="card" aria-label="Nature ambience">
  <h1>Nature ambience</h1>
  <p class="sub">Wind, grass, birds, rain and crickets, synthesised with Web Audio. No audio files.</p>
  <canvas class="viz" data-viz aria-hidden="true"></canvas>
  <div class="meters" aria-hidden="true">
    <span class="meter">Wind<i data-meter="wind"></i></span>
    <span class="meter">Grass<i data-meter="rustle"></i></span>
    <span class="meter">Birds<i data-meter="birds"></i></span>
    <span class="meter">Rain<i data-meter="rain"></i></span>
    <span class="meter">Crickets<i data-meter="crickets"></i></span>
  </div>
  <div class="row">
    <button type="button" class="play" data-play aria-pressed="false">
      <svg class="ic-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2c0-.6.7-1 1.2-.6l6.3 4.8c.4.3.4.9 0 1.2l-6.3 4.8c-.5.4-1.2 0-1.2-.6z"/></svg>
      <svg class="ic-stop" viewBox="0 0 16 16" aria-hidden="true"><rect x="3.5" y="3.5" width="9" height="9" rx="1.6"/></svg>
      <span>Play</span>
    </button>
    <div class="seg" role="group" aria-label="Weather">
      <button type="button" data-weather="clear" aria-pressed="true">Clear</button>
      <button type="button" data-weather="cloudy" aria-pressed="false">Cloudy</button>
      <button type="button" data-weather="rain" aria-pressed="false">Rain</button>
      <button type="button" data-weather="dusk" aria-pressed="false">Dusk</button>
    </div>
  </div>
  <div class="row">
    <button type="button" class="ghost" data-gust>
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6h7.5a2 2 0 1 0-2-2"/><path d="M2 9.5h10a2 2 0 1 1-2 2"/><path d="M2 13h4"/></svg>
      Gust
    </button>
    <label>Muffle<input type="range" min="0" max="1" step="0.01" value="0" data-muffle></label>
  </div>
  <p class="note" data-note aria-live="polite"></p>
</main>
<script type="module" src="app.js"></script>
</body>
</html>
