<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Uncertainty Slider</title>
<link rel="stylesheet" href="../variants/html/uncertainty-slider.css">
<style>
  :root {
    --card: #ffffff;
    --label: #1d1d1f;
    --label-2: #636366;
    --label-3: #86868b;
    --hair: rgba(0, 0, 0, 0.1);
    --accent-text: #0066cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --card: #1c1c1e;
      --label: #f5f5f7;
      --label-2: #aaaaaf;
      --label-3: #6e6e73;
      --hair: rgba(255, 255, 255, 0.12);
      --accent-text: #2997ff;
    }
  }
  html, body { min-height: 100%; margin: 0; background: transparent; }
  body {
    display: grid;
    place-items: center;
    min-height: 100vh;
    padding: 24px 16px;
    box-sizing: border-box;
    color: var(--label);
    font: 400 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { width: min(680px, 100%); }
  @media (min-width: 720px) { .us { --us-plot-h: 200px; } .us-readout { font-size: 46px; } }
  .card {
    background: var(--card);
    border-radius: 22px;
    padding: 24px 26px 20px;
  }
  .eyebrow {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--label-2);
    font-size: 13px;
    font-weight: 500;
  }
  h1 {
    margin: 6px 0 18px;
    font-size: 21px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .out {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 6px 16px;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 0.5px solid var(--hair);
    color: var(--label-2);
    font-size: 13px;
  }
  .out code {
    color: var(--label);
    font: 500 13px/1.4 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  .hint {
    margin: 14px 4px 0;
    color: var(--label-2);
    font-size: 13px;
    text-align: center;
  }
  @media (max-width: 480px) {
    .card { padding: 20px 18px 16px; border-radius: 18px; }
    .us-readout { font-size: 34px; }
    h1 { font-size: 19px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <section class="card" aria-labelledby="q">
    <div class="eyebrow"><span>Checkout redesign</span><span>Sprint 42 planning</span></div>
    <h1 id="q">How long will it take?</h1>
    <div id="estimate" data-uncertainty-slider
         data-label="How long will the checkout redesign take"
         data-min="0" data-max="30" data-step="1"
         data-value="12" data-spread="3" data-unit="days"></div>
    <div class="out"><span>Sent to the planner</span><code id="json"></code></div>
  </section>
  <p class="hint">Drag the dot sideways for the estimate, up when you’re sure, down when you’re not.</p>
</div>
<script src="../variants/html/uncertainty-slider.js"></script>
<script>
  const el = document.getElementById('estimate');
  const out = document.getElementById('json');
  const show = (v) => { out.textContent = `{ mean: ${v.mean}, low: ${v.low}, high: ${v.high} }`; };
  show(el.uncertaintySlider.value);
  el.addEventListener('input', (e) => show(e.detail));
  el.addEventListener('change', (e) => show(e.detail));

  // ?shot=1 — frozen for the poster: the dot held mid-drag, the vertical guide visible
  const q = new URLSearchParams(location.search);
  if (q.has('shot')) {
    el.uncertaintySlider.set({ mean: Number(q.get('mean') ?? 12), spread: Number(q.get('spread') ?? 3) });
    el.uncertaintySlider.grab(true);
    show(el.uncertaintySlider.value);
  }
</script>
</body>
</html>
