<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Bubble Target Cursor</title>
<link rel="stylesheet" href="../variants/html/bubble-cursor.css">
<style>
  :root {
    --ink: #1d1d1f; --muted: #6e6e73; --edge: rgba(0, 0, 0, 0.08); --app: #ffffff; --board: #f6f6f7;
    --dot: rgba(0, 0, 0, 0.085); --bar: rgba(255, 255, 255, 0.92); --frame: #ffffff; --wire: #ececef; --wire-2: #e2e2e6;
    --fill: rgba(118, 118, 128, 0.12); --fill-hover: rgba(118, 118, 128, 0.2); --accent: #0073e6; --on-accent: #fff;
    --toast: #1d1d1f; --on-toast: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #f5f5f7; --muted: #a1a1a6; --edge: rgba(255, 255, 255, 0.1); --app: #1c1c1e; --board: #141416;
      --dot: rgba(255, 255, 255, 0.075); --bar: rgba(28, 28, 30, 0.92); --frame: #232326; --wire: #303034; --wire-2: #38383d;
      --fill: rgba(118, 118, 128, 0.24); --fill-hover: rgba(118, 118, 128, 0.34); --accent: #0a84ff;
      --toast: #f5f5f7; --on-toast: #000;
    }
  }
  html, body { height: 100%; margin: 0; background: transparent; }
  body {
    display: grid; place-items: center; box-sizing: border-box; padding: 20px;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }
  .stage { width: min(1100px, 100%); display: grid; gap: 12px; }

  .app {
    position: relative; height: clamp(520px, calc(100vh - 104px), 760px); border-radius: 18px; overflow: hidden;
    background: var(--board);
    background-image: radial-gradient(var(--dot) 1px, transparent 1.2px);
    background-size: 20px 20px; background-position: 10px 10px;
    box-shadow: 0 0 0 0.5px var(--edge), 0 30px 60px -34px rgba(0, 0, 0, 0.28);
  }
  button {
    font: inherit; color: inherit; border: 0; background: transparent; padding: 0; cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .icon {
    width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; color: var(--ink);
    transition: background-color 160ms cubic-bezier(.25, .1, .25, 1), scale 100ms cubic-bezier(.23, 1, .32, 1);
  }
  .icon svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  @media (hover: hover) and (pointer: fine) { .icon:hover { background: var(--fill); } }
  .icon.bt-captured { background: var(--fill); }
  .icon[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  .topbar {
    position: absolute; inset: 0 0 auto 0; height: 52px; display: flex; align-items: center; gap: 4px; padding: 0 12px;
    background: var(--bar); box-shadow: 0 0.5px 0 var(--edge); z-index: 2;
  }
  .sep { width: 0.5px; height: 18px; background: var(--edge); margin: 0 8px; flex: none; }
  .file { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 8px; font-weight: 600; }
  .file small { font-weight: 400; color: var(--muted); font-size: 13px; }
  .file svg { width: 14px; height: 14px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .spacer { flex: 1; }
  .people { display: flex; margin-right: 10px; }
  .people span {
    width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 650;
    color: #fff; margin-left: -5px; box-shadow: 0 0 0 2px var(--app);
  }
  .share { height: 30px; padding: 0 14px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 600; margin-right: 6px; }
  .zoomlabel { height: 30px; min-width: 52px; border-radius: 8px; font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }

  .board { position: absolute; inset: 52px 0 0 0; }
  .frames {
    position: absolute; left: 50%; top: 46%; display: flex; gap: 72px; transform: translate(-50%, -50%) scale(var(--zoom, 1));
    transition: transform 240ms cubic-bezier(.23, 1, .32, 1);
  }
  .frame { position: relative; }
  .frame > b { position: absolute; top: -22px; left: 2px; font-size: 12px; font-weight: 500; color: var(--muted); white-space: nowrap; }
  .phone {
    width: 176px; height: 352px; border-radius: 22px; background: var(--frame); box-shadow: 0 0 0 0.5px var(--edge), 0 8px 24px -16px rgba(0, 0, 0, 0.25);
    padding: 34px 16px 18px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px;
  }
  .phone i { display: block; border-radius: 6px; background: var(--wire); }
  .phone i.img { height: 118px; border-radius: 12px; background: var(--wire-2); }
  .phone i.h { height: 14px; width: 78%; }
  .phone i.t { height: 8px; }
  .phone i.t.s { width: 62%; }
  .phone i.row { height: 30px; border-radius: 9px; }
  .phone i.cta { margin-top: auto; height: 34px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 28%, var(--wire)); }

  .pin {
    position: absolute; width: 24px; height: 24px; border-radius: 12px 12px 12px 3px; display: grid; place-items: center;
    font-size: 10px; font-weight: 700; color: #fff; box-shadow: 0 0 0 2px var(--app), 0 4px 10px -4px rgba(0, 0, 0, 0.4);
    transition: scale 100ms cubic-bezier(.23, 1, .32, 1);
  }
  .note {
    position: absolute; width: 220px; padding: 10px 12px; border-radius: 12px; background: var(--app); font-size: 13px;
    box-shadow: 0 0 0 0.5px var(--edge), 0 12px 30px -12px rgba(0, 0, 0, 0.35); z-index: 3;
  }
  .note[hidden] { display: none; }
  .note b { display: block; font-weight: 600; margin-bottom: 2px; }
  .note b span { font-weight: 400; color: var(--muted); }

  .rail, .tools {
    position: absolute; display: flex; gap: 4px; padding: 5px; border-radius: 14px; background: var(--bar);
    box-shadow: 0 0 0 0.5px var(--edge), 0 10px 30px -18px rgba(0, 0, 0, 0.4); z-index: 2;
  }
  .rail { right: 16px; top: 50%; translate: 0 -50%; flex-direction: column; }
  .tools { left: 50%; bottom: 18px; translate: -50% 0; align-items: center; }
  .tools .icon { width: 34px; height: 34px; border-radius: 10px; }
  .tools .sep { height: 20px; margin: 0 5px; }

  .toast {
    position: absolute; left: 50%; top: 68px; translate: -50% 0; padding: 7px 14px; border-radius: 999px; font-size: 13px; font-weight: 500;
    background: var(--toast); color: var(--on-toast); opacity: 0; pointer-events: none; z-index: 4;
    transition: opacity 160ms cubic-bezier(.25, .1, .25, 1), translate 240ms cubic-bezier(.23, 1, .32, 1);
  }
  .toast.show { opacity: 1; translate: -50% 4px; }

  .hint { display: flex; align-items: center; gap: 14px; padding: 0 6px; color: var(--muted); font-size: 13px; min-height: 28px; }
  .hint .now { color: var(--ink); font-variant-numeric: tabular-nums; min-width: 12ch; }
  .hint .grow { flex: 1; }
  .touch-only { display: none; }
  @media (hover: none) { .touch-only { display: inline; } .mouse-only { display: none; } }
  .switch { display: inline-flex; align-items: center; gap: 8px; height: 28px; color: var(--ink); }
  .switch span {
    position: relative; width: 32px; height: 20px; border-radius: 999px; background: #8c8c91; transition: background-color 160ms;
  }
  .switch span::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); transition: translate 240ms cubic-bezier(.23, 1, .32, 1);
  }
  .switch[aria-checked="true"] span { background: var(--accent); }
  .switch[aria-checked="true"] span::after { translate: 12px 0; }

  @media (max-width: 640px) {
    body { padding: 12px; }
    .app { height: calc(100vh - 92px); min-height: 560px; }
    .undo, .redo, .people, .zoomlabel, .topbar .sep, .file small { display: none; }
    .frames { gap: 40px; top: 44%; --zoom: 0.8; }
    .frame:nth-child(n + 3) { display: none; }
    .phone { width: 150px; height: 300px; padding: 28px 12px 14px; gap: 8px; }
    .phone i.img { height: 92px; }
    .rail { right: 10px; top: 42%; }
    .tools { bottom: 14px; }
    .tools .icon { width: 32px; height: 32px; }
    .note { width: 180px; }
    .hint { flex-wrap: wrap; gap: 6px 12px; }
    .hint .grow { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .frames, .toast, .switch span::after { transition: none; }
  }
</style>
</head>
<body>
<div class="stage">
  <div class="app" data-bubble-cursor data-reach="130">
    <header class="topbar">
      <button class="icon" aria-label="Main menu" data-say="Main menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <button class="icon undo" aria-label="Undo" data-say="Undid: move frame"><svg viewBox="0 0 24 24"><path d="M9 6 4.5 10.5 9 15"/><path d="M5 10.5h9.5a5 5 0 0 1 0 10H11"/></svg></button>
      <button class="icon redo" aria-label="Redo" data-say="Nothing to redo"><svg viewBox="0 0 24 24"><path d="m15 6 4.5 4.5L15 15"/><path d="M19 10.5H9.5a5 5 0 0 0 0 10H13"/></svg></button>
      <span class="sep"></span>
      <button class="file" aria-label="File: Onboarding flow" data-say="Rename file">Onboarding flow <small>v3</small><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button>
      <span class="spacer"></span>
      <span class="people" aria-label="3 people here">
        <span style="background:#c2410c">MK</span><span style="background:#0f766e">JS</span><span style="background:#4b5563">AR</span>
      </span>
      <button class="share" data-say="Link copied">Share</button>
      <button class="icon" aria-label="Present" data-say="Presenting from 01 Welcome"><svg viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z"/></svg></button>
      <button class="zoomlabel" aria-label="Reset zoom" data-zoom="reset">100%</button>
    </header>

    <div class="board">
      <div class="frames">
        <div class="frame"><b>01 Welcome</b>
          <div class="phone"><i class="img"></i><i class="h"></i><i class="t"></i><i class="t s"></i><i class="cta"></i></div>
        </div>
        <div class="frame"><b>02 Permissions</b>
          <div class="phone"><i class="h"></i><i class="t s"></i><i class="row"></i><i class="row"></i><i class="row"></i><i class="cta"></i></div>
        </div>
        <div class="frame"><b>03 First task</b>
          <div class="phone"><i class="h"></i><i class="row"></i><i class="img" style="height:84px"></i><i class="t"></i><i class="t s"></i><i class="cta"></i></div>
        </div>
      </div>
      <button class="pin" style="background:#c2410c" aria-expanded="false" aria-controls="n1" aria-label="Comment by Mira K.">MK</button>
      <div class="note" id="n1" hidden><b>Mira K. <span>· 2h</span></b>Can the button sit above the fold on 5.4-inch phones?</div>
      <button class="pin" style="background:#0f766e" aria-expanded="false" aria-controls="n2" aria-label="Comment by Jon S.">JS</button>
      <div class="note" id="n2" hidden><b>Jon S. <span>· 25m</span></b>Swap the picture for the real task list here.</div>

      <nav class="rail" aria-label="Zoom">
        <button class="icon" aria-label="Zoom in" data-zoom="in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon" aria-label="Zoom out" data-zoom="out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
        <button class="icon" aria-label="Zoom to fit" data-zoom="reset"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg></button>
      </nav>

      <nav class="tools" aria-label="Tools">
        <button class="icon" aria-label="Move" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M6 3.5 18.5 10l-5.6 1.6-2.6 5.4z"/></svg></button>
        <span class="sep"></span>
        <button class="icon" aria-label="Frame" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M8 3.5v17M16 3.5v17M3.5 8h17M3.5 16h17"/></svg></button>
        <button class="icon" aria-label="Rectangle" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4.5" y="5.5" width="15" height="13" rx="1.5"/></svg></button>
        <button class="icon" aria-label="Ellipse" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/></svg></button>
        <button class="icon" aria-label="Pen" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3.5 18 11l-6 9.5L6 11z"/><path d="M12 3.5V10"/><circle cx="12" cy="12" r="1.6"/></svg></button>
        <button class="icon" aria-label="Text" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M5.5 7V4.5h13V7M12 4.5v15M9 19.5h6"/></svg></button>
        <span class="sep"></span>
        <button class="icon" aria-label="Comment" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4.5 5.5h15v10.5H10l-5.5 4z"/></svg></button>
      </nav>
      <div class="toast" role="status" aria-live="polite"></div>
    </div>
  </div>

  <div class="hint">
    <span><span class="mouse-only">Click anywhere: the nearest control takes it.</span><span class="touch-only">Tap near a control: the nearest one takes it.</span></span>
    <span class="now mouse-only" aria-hidden="true"></span>
    <span class="grow"></span>
    <button class="switch" role="switch" aria-checked="false"><span></span>Hit areas</button>
  </div>
</div>

<script src="../variants/html/bubble-cursor.js"></script>
<script>
(() => {
  const app = document.querySelector('.app');
  const bc = app.bubbleCursor;
  const toast = app.querySelector('.toast');
  const now = document.querySelector('.hint .now');
  const sw = document.querySelector('.switch');
  const zl = app.querySelector('.zoomlabel');
  const frames = app.querySelector('.frames');
  const phone = matchMedia('(max-width: 640px)');
  let zoom = 1, tid = 0;

  // pins sit on the frames: top-right of the CTA on 01, beside the picture on 03
  const pins = app.querySelectorAll('.pin');
  const notes = app.querySelectorAll('.note');
  function placePins() {
    const b = app.querySelector('.board').getBoundingClientRect();
    const f = app.querySelectorAll('.phone');
    const spots = [[f[0], 0.84, 0.86], phone.matches ? [f[1], 0.16, 0.4] : [f[2], 0.9, 0.3]];
    spots.forEach(([el, fx, fy], i) => {
      const r = el.getBoundingClientRect();
      const x = r.left - b.left + r.width * fx, y = r.top - b.top + r.height * fy;
      pins[i].style.left = `${x}px`; pins[i].style.top = `${y - 24}px`;
      const nx = Math.min(x + 30, b.width - (phone.matches ? 190 : 232));
      notes[i].style.left = `${nx}px`; notes[i].style.top = `${y - 24}px`;
    });
  }
  placePins();
  addEventListener('resize', placePins);
  frames.addEventListener('transitionend', placePins);

  const say = (text) => {
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(tid);
    tid = setTimeout(() => toast.classList.remove('show'), 1400);
  };
  app.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    if (btn.dataset.say) say(btn.dataset.say);
    if (btn.hasAttribute('aria-pressed')) {
      app.querySelectorAll('.tools [aria-pressed]').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      say(`${btn.getAttribute('aria-label')} tool`);
    }
    if (btn.classList.contains('pin')) {
      const open = btn.getAttribute('aria-expanded') !== 'true';
      pins.forEach((p, i) => { const o = p === btn && open; p.setAttribute('aria-expanded', String(o)); notes[i].hidden = !o; });
    }
    const z = btn.dataset.zoom;
    if (z) {
      zoom = z === 'in' ? Math.min(1.6, zoom + 0.1) : z === 'out' ? Math.max(0.6, zoom - 0.1) : 1;
      frames.style.setProperty('--zoom', (phone.matches ? 0.8 : 1) * zoom);
      zl.textContent = `${Math.round(zoom * 100)}%`;
      if (z !== 'reset' || btn === zl) say(`Zoom ${Math.round(zoom * 100)}%`);
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) placePins();
    }
  });

  app.addEventListener('bubbletarget', (e) => {
    const t = e.detail.target;
    now.textContent = t ? `${t.getAttribute('aria-label') || t.textContent.trim()} · ${e.detail.distance} px away` : '';
  });

  sw.addEventListener('click', () => {
    const on = sw.getAttribute('aria-checked') !== 'true';
    sw.setAttribute('aria-checked', String(on));
    bc.showAreas(on);
  });

  // ?shot=1: a still frame for the poster. The pointer hangs above the tools, moving towards the zoom rail.
  if (new URLSearchParams(location.search).has('shot')) {
    sw.setAttribute('aria-checked', 'true');
    bc.showAreas(true);
    const rect = (sel) => app.querySelector(sel).getBoundingClientRect();
    const pin = rect('.pin'), zin = rect('[aria-label="Zoom in"]');
    const x = pin.left + pin.width / 2 + 96, y = pin.top + pin.height / 2 - 52;
    const tx = zin.left + zin.width / 2, ty = zin.top + zin.height / 2;
    const l = Math.hypot(tx - x, ty - y);
    bc.pointAt(x, y, ((tx - x) / l) * 1.7, ((ty - y) / l) * 1.7);
  }
})();
</script>
</body>
</html>
