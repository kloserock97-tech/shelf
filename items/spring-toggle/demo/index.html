<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Spring Toggle</title>
<link rel="stylesheet" href="../variants/html/toggle.css">
<style>
  html, body { height: 100%; margin: 0; background: transparent; }
  body { display: grid; place-items: center; }
  .stage { transform: scale(2.4); }
</style>
</head>
<body>
<div class="stage">
  <button class="toggle" role="switch" aria-checked="true" aria-label="Autoplay previews">
    <span class="toggle__knob"></span>
  </button>
</div>
<script src="../variants/html/toggle.js"></script>
</body>
</html>
