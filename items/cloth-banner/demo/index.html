<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Cloth Banner</title>
<link rel="stylesheet" href="../variants/html/cloth-banner.css">
<style>
  html, body { height: 100%; margin: 0; background: transparent; overflow: hidden; }
  body {
    display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center;
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; color: #24201c;
    --accent: #2c2a27; --accent-ink: #fbf7f0; --line: #24201c2e;
  }
  .stage { width: 100%; min-height: 0; }
  .cloth-banner { min-height: 0; }
  .foot { display: grid; justify-items: center; gap: 12px; padding: 4px 16px 26px; text-align: center; }
  .foot p { margin: 0; opacity: .66; }
  .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  button {
    font: inherit; font-weight: 600; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    border: 1px solid var(--line); background: transparent; color: inherit;
    transition: background-color .15s, transform .15s;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button:active { transform: scale(.97); }
  button[aria-pressed="true"] { background: #24201c14; }
  button svg { width: 16px; height: 16px; vertical-align: -3px; margin-right: 6px; }
  button:focus-visible { outline: 2px solid #3b5a8c; outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (prefers-color-scheme: dark) {
    body { color: #eee8de; --accent: #f1ebe1; --accent-ink: #1b1a18; --line: #eee8de33; }
    button[aria-pressed="true"] { background: #eee8de1f; }
    button:focus-visible { outline-color: #9db6dd; }
  }
  @media (prefers-reduced-motion: reduce) { button { transition: none; } button:active { transform: none; } }
  .shot .foot { padding-bottom: 30px; }
</style>
</head>
<body>
<div class="stage cloth-banner" role="img" aria-label="A cloth banner hanging from a rod: Nothing here yet.">
  <canvas aria-hidden="true"></canvas>
</div>
<div class="foot">
  <h1 class="sr">Nothing here yet</h1>
  <p>Saved items will hang here. Pull the cloth, it is real.</p>
  <div class="row">
    <button type="button" class="primary" id="add">Add your first item</button>
    <button type="button" id="breeze" aria-pressed="false">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
        <path d="M2 6h8.5a2 2 0 1 0-2-2M2 10h11a2 2 0 1 1-2 2"/>
      </svg>Breeze</button>
  </div>
</div>
<script type="module">
  import { createClothBanner, paintBanner } from "../variants/html/cloth-banner.js";

  const query = new URLSearchParams(location.search);
  const shot = query.has("shot");
  if (shot) document.documentElement.classList.add("shot");
  const canvas = document.querySelector(".stage canvas");
  const breeze = document.querySelector("#breeze");

  const banner = createClothBanner(canvas, { intro: !shot, frozen: shot });
  // with reduced motion the cloth hangs still, so the breeze switch has nothing to do
  const reducedQuery = matchMedia("(prefers-reduced-motion: reduce)");
  const syncBreeze = () => { breeze.hidden = !banner || reducedQuery.matches; };
  syncBreeze(); reducedQuery.addEventListener("change", syncBreeze);
  if (!banner) {
    // no WebGL2: the print as a flat picture
    breeze.hidden = true;
    const g = canvas.getContext("2d");
    const draw = () => {
      const dpr = Math.min(devicePixelRatio || 1, 2), r = canvas.getBoundingClientRect();
      canvas.width = r.width * dpr; canvas.height = r.height * dpr;
      const h = r.height * 0.86, w = h * 0.7, x = (r.width - w) / 2, y = r.height * 0.06;
      g.setTransform(dpr, 0, 0, dpr, x * dpr, y * dpr);
      const dark = matchMedia("(prefers-color-scheme: dark)").matches;
      paintBanner(g, w, h, { eyebrow: "SAVED ITEMS", lines: ["Nothing", "here", "yet."], tip: 0,
        colors: { cloth: dark ? "#b9563a" : "#c65d3c", ink: "#fbf2e4", soft: "rgba(251,242,228,0.62)" } });
    };
    draw(); addEventListener("resize", draw);
  } else if (shot) {
    // a still frame: a light breeze and the lower right corner pulled out towards the viewer, 2 s of simulation
    banner.setWind(0.4);
    banner.pull(0.8, 0.94, [0.24, 0.1, 0.42]);
    banner.advance(2);
  }

  document.querySelector("#add").addEventListener("click", () => banner?.gust(1));
  breeze.addEventListener("click", () => {
    const on = breeze.getAttribute("aria-pressed") !== "true";
    breeze.setAttribute("aria-pressed", String(on));
    banner?.setWind(on ? 0.55 : 0);
  });
</script>
</body>
</html>
