<!-- The stage needs a size (it is a size container); pages are its direct children and stack in order. -->
<div class="pb" id="app" style="width: 390px; height: 844px">
  <section data-pb-page aria-labelledby="trips-title">
    <h1 id="trips-title" data-pb-title>Trips</h1>
    <button type="button" id="open-lisbon">Lisbon</button>
  </section>

  <section data-pb-page aria-labelledby="trip-title">
    <button type="button" id="back">Trips</button>
    <h1 id="trip-title" data-pb-title>Lisbon</h1>
  </section>

  <div class="pb-arrow" aria-hidden="true">
    <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.5 4.5 7 10l5.5 5.5"/></svg>
  </div>
</div>

<link rel="stylesheet" href="predictive-back.css">
<script type="module">
  import { predictiveBack } from './predictive-back.js';

  const app = document.getElementById('app');
  const [trips, trip] = app.querySelectorAll('[data-pb-page]');
  const nav = predictiveBack(app, { root: trips });

  document.getElementById('open-lisbon').onclick = () => nav.push(trip);
  document.getElementById('back').onclick = () => nav.back();
</script>
