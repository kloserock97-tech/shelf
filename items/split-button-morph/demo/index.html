<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Split Button Morph</title>
<link rel="stylesheet" href="../variants/html/split-button.css">
<style>
  html, body { margin: 0; background: transparent; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: minmax(0, 560px);
    justify-content: center;
    align-content: start;
    padding: clamp(32px, 18vh, 150px) 16px 32px;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: light-dark(#17181b, #ececee);
  }
  .doc {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 18px 16px;
    padding: 18px 18px 18px 20px;
    border-radius: 24px;
    background: light-dark(#ffffff, #1b1c1f);
    box-shadow: 0 1px 2px light-dark(rgba(0, 0, 0, 0.05), rgba(0, 0, 0, 0.4));
  }
  .doc__title { margin: 0; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
  .doc__meta { margin: 3px 0 0; font-size: 13px; color: light-dark(#6b6d74, #8e9097); }
  .doc__actions { display: flex; flex-wrap: wrap; gap: 10px; }
  .status { min-height: 20px; margin: 14px 0 0 20px; font-size: 13px; color: light-dark(#6b6d74, #8e9097); }
  html.is-shot body { zoom: 1.25; min-height: calc(100dvh / 1.25); padding-top: 70px; }
  @media (max-width: 520px) {
    .doc { padding: 16px; }
    .doc__actions { width: 100%; flex-direction: column; align-items: flex-end; }
  }
</style>
<script>
  // ?shot=1 starts from a clean slate (no remembered choice)
  if (new URLSearchParams(location.search).has('shot')) {
    try { localStorage.removeItem('spb:export'); localStorage.removeItem('spb:save'); } catch {}
  }
</script>
</head>
<body>
<section>
  <div class="doc">
    <div>
      <h1 class="doc__title">Q3 field report</h1>
      <p class="doc__meta">12 pages · edited 4 min ago</p>
    </div>
    <div class="doc__actions">
      <div class="spb spb--soft" data-key="save">
        <button class="spb__main" type="button">
          <span class="spb__icon" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4.4 2.8h7.2l3.2 3.2v7.6c0 .9-.7 1.6-1.6 1.6H4.4c-.9 0-1.6-.7-1.6-1.6V4.4c0-.9.7-1.6 1.6-1.6Z"/><path d="M6 2.8v3.4h5V2.8M5.8 15.2v-4.4h6.4v4.4"/></svg>
            <svg class="spb__done" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 9.4 3.2 3.1L14 5.6"/></svg>
          </span>
          <span class="spb__label">Save</span>
        </button>
        <button class="spb__toggle" type="button" commandfor="save-menu" command="toggle-popover" aria-label="Save options" aria-haspopup="menu" aria-expanded="false">
          <svg class="spb__chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6.2 4 4 4-4"/></svg>
        </button>
        <div class="spb__menu" id="save-menu" popover role="menu" aria-label="Save as">
          <button class="spb__item" type="button" role="menuitemradio" aria-checked="true" data-value="save" data-label="Save">
            <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h8l3.5 3.5v8.5c0 .6-.4 1-1 1H5c-.6 0-1-.4-1-1v-11c0-.6.4-1 1-1Z"/></svg></span>
            <span>Save<small>Overwrite this file</small></span>
            <svg class="spb__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.4 2.9 2.8 6.1-6.4"/></svg>
          </button>
          <button class="spb__item" type="button" role="menuitemradio" aria-checked="false" data-value="copy" data-label="Save copy">
            <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="6.5" y="6.5" width="10" height="10" rx="2"/><path d="M13.5 6.5V5c0-.8-.7-1.5-1.5-1.5H5c-.8 0-1.5.7-1.5 1.5v7c0 .8.7 1.5 1.5 1.5h1.5"/></svg></span>
            <span>Save as copy<small>Keeps the original</small></span>
            <svg class="spb__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.4 2.9 2.8 6.1-6.4"/></svg>
          </button>
          <button class="spb__item" type="button" role="menuitemradio" aria-checked="false" data-value="template" data-label="Save template">
            <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="13" height="13" rx="2.5"/><path d="M3.5 8h13M8 8v8.5"/></svg></span>
            <span>Save as template<small>Reuse the layout</small></span>
            <svg class="spb__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.4 2.9 2.8 6.1-6.4"/></svg>
          </button>
        </div>
      </div>

      <div class="spb" data-key="export">
        <button class="spb__main" type="button">
          <span class="spb__icon" aria-hidden="true">
            <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2.8v8.4M5.6 7.8 9 11.2l3.4-3.4M3.2 12.6v1.2c0 .8.6 1.4 1.4 1.4h8.8c.8 0 1.4-.6 1.4-1.4v-1.2"/></svg>
            <svg class="spb__done" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m4 9.4 3.2 3.1L14 5.6"/></svg>
          </span>
          <span class="spb__label">Export PNG</span>
        </button>
        <button class="spb__toggle" type="button" commandfor="export-menu" command="toggle-popover" aria-label="Export options" aria-haspopup="menu" aria-expanded="false">
          <svg class="spb__chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 6.2 4 4 4-4"/></svg>
        </button>
        <div class="spb__menu" id="export-menu" popover role="menu" aria-label="Export format">
          <button class="spb__item" type="button" role="menuitemradio" aria-checked="true" data-value="png" data-label="Export PNG">
            <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2.5"/><path d="m3.5 14 4-4 3 3 2-2 4 4"/><circle cx="13" cy="7.5" r="1.3"/></svg></span>
            <span>PNG image<small>Raster, 2×</small></span>
            <svg class="spb__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.4 2.9 2.8 6.1-6.4"/></svg>
          </button>
          <button class="spb__item" type="button" role="menuitemradio" aria-checked="false" data-value="jpg" data-label="Export JPG">
            <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3.5" width="14" height="13" rx="2.5"/><path d="M3.5 12.5c3-2.5 5.5-2.5 8 0s4 1.5 5-0.5"/></svg></span>
            <span>JPG image<small>Smaller, no transparency</small></span>
            <svg class="spb__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.4 2.9 2.8 6.1-6.4"/></svg>
          </button>
          <button class="spb__item" type="button" role="menuitemradio" aria-checked="false" data-value="pdf" data-label="Export PDF">
            <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5.5 2.5h6l4 4v10c0 .6-.4 1-1 1h-9c-.6 0-1-.4-1-1v-13c0-.6.4-1 1-1Z"/><path d="M11.5 2.5v4h4M7.5 11h5M7.5 14h3"/></svg></span>
            <span>PDF document<small>Vector, print-ready</small></span>
            <svg class="spb__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.4 2.9 2.8 6.1-6.4"/></svg>
          </button>
          <button class="spb__item" type="button" role="menuitemradio" aria-checked="false" data-value="svg" data-label="Export SVG">
            <span aria-hidden="true"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15.5 10 4l6 11.5"/><circle cx="4" cy="15.5" r="1.4"/><circle cx="16" cy="15.5" r="1.4"/><circle cx="10" cy="4" r="1.4"/></svg></span>
            <span>SVG vector<small>Editable shapes</small></span>
            <svg class="spb__check" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m3.5 8.4 2.9 2.8 6.1-6.4"/></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
  <p class="status" role="status" id="status"></p>
</section>

<script src="../variants/html/split-button.js"></script>
<script>
  const status = document.getElementById('status');
  const names = { png: 'q3-field-report.png', jpg: 'q3-field-report.jpg', pdf: 'q3-field-report.pdf', svg: 'q3-field-report.svg', save: 'Saved', copy: 'Saved “Q3 field report (copy)”', template: 'Saved as template “Field report”' };
  document.addEventListener('spb:run', (e) => {
    const v = e.detail.value;
    status.textContent = ['png', 'jpg', 'pdf', 'svg'].includes(v) ? `Exported ${names[v]}` : names[v];
  });

  // ?shot=1 — PDF was picked last time, the export menu is open on it
  if (new URLSearchParams(location.search).has('shot')) {
    document.documentElement.classList.add('is-shot');
    const root = document.querySelector('.spb[data-key="export"]');
    const pdf = root.querySelector('[data-value="pdf"]');
    root.querySelectorAll('.spb__item').forEach((i) => i.setAttribute('aria-checked', String(i === pdf)));
    root.querySelector('.spb__label').textContent = 'Export PDF';
    setTimeout(() => { root.querySelector('.spb__menu').showPopover({ source: root.querySelector('.spb__toggle') }); setTimeout(() => document.activeElement?.blur(), 60); }, 150);
  }
</script>
</body>
</html>
